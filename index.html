/* Rumble refresh: colorful, accessible, responsive UI */
:root{--navy:#26347d;--blue:#3157d5;--paper:#f5f7ff;--ink:#18213d;--muted:#5f6b85;--line:#dfe5f2;--green:#087f68;--purple:#7554d9;--teal:#087f8c;--orange:#f4a340;--surface:#fff}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{background:radial-gradient(ellipse at 92% 0%,#e7eaff 0,transparent 32%),var(--paper);color:var(--ink);font-size:15px;line-height:1.55}
.layout{grid-template-columns:244px minmax(0,1fr);gap:0}
.side{position:sticky;inset:auto;width:auto;height:100vh;overflow-y:auto;z-index:1000;padding:25px 16px;background:linear-gradient(165deg,#273781 0%,#4436a0 58%,#5d3ca9 100%);box-shadow:8px 0 28px #25347712;transition:none}
.side:hover,.side:focus-within{width:auto;padding:25px 16px}
.brand{font-size:16px;letter-spacing:-.02em}
.logo{display:inline-grid;place-items:center;min-width:42px;min-height:42px;background:linear-gradient(135deg,#ffd36a,#ff9c67);color:#26347d;border-radius:14px;box-shadow:0 6px 18px #101c5128}
.side .brand small{display:inline-block;margin-top:3px;color:#dce5ff;font:500 10px 'DM Sans',sans-serif;letter-spacing:.04em}
.nav{gap:7px}
.nav button{min-height:44px;border:1px solid transparent;border-radius:12px;padding:11px 12px;color:#e6eaff;font-weight:600;transition:background .16s ease,border-color .16s ease,transform .16s ease}
.nav button:hover{background:#ffffff18;border-color:#ffffff20;transform:translateX(2px)}
.nav button.active{background:linear-gradient(100deg,#ffffff2a,#ffffff14);border-color:#ffffff35;color:#fff;box-shadow:inset 3px 0 #ffd36a}
.side footer{color:#d6ddff;font-size:11px}
.main{grid-column:2;min-width:0}
.top{position:sticky;top:0;z-index:900;min-height:68px;height:auto;padding:12px 30px;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid #dfe5f2}
.account-chip{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;font-weight:700;color:#303b66}
.account-dot{width:9px;height:9px;border-radius:50%;background:#0b9876;box-shadow:0 0 0 4px #d8f6ec}
.role-lock{border-radius:999px;background:#e5f8f0;color:#087455;padding:4px 8px;font-size:10px;letter-spacing:.02em}
.content{max-width:1450px;padding:30px 32px 44px}
.head{align-items:center;margin-bottom:25px}
.kicker{color:#6849ce;letter-spacing:.12em;font-size:10px}
.head h2{font-size:clamp(23px,2.4vw,31px);letter-spacing:-.035em;line-height:1.18;color:#1c2851}
.head p,.muted{color:var(--muted);line-height:1.6}
.btn{min-height:42px;padding:10px 15px;border-radius:11px;border-color:#dce3f1;background:#fff;box-shadow:0 2px 4px #1c2b5010;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px #27378116}
.btn:active{transform:translateY(0)}
.primary{background:linear-gradient(120deg,#3157d5,#684bd2);border-color:#3157d5;color:#fff;box-shadow:0 6px 16px #3157d533}
.primary:hover{background:linear-gradient(120deg,#284bc0,#5b3ec4)}
.grid{gap:18px}
.card{border:1px solid #e0e6f3;border-radius:18px;padding:22px;background:#ffffff;box-shadow:0 5px 22px #263b7810}
.card h3{color:#202d59;font-size:15px;letter-spacing:-.01em}
.stats{gap:14px}
.stats>.card{position:relative;overflow:hidden;min-height:142px;padding:20px;border:1px solid transparent}
.stats>.card:after{content:"";position:absolute;right:-18px;top:-24px;width:88px;height:88px;border-radius:50%;background:currentColor;opacity:.055}
.stats>.card:nth-child(1){background:#eef2ff;border-color:#dfe6ff;color:#3157d5}
.stats>.card:nth-child(2){background:#e9faf5;border-color:#d2f2e8;color:#087f68}
.stats>.card:nth-child(3){background:#fff5e7;border-color:#f8e7c8;color:#a65a05}
.stats>.card:nth-child(4){background:#f4efff;border-color:#e7ddff;color:#7554d9}
.statlabel{color:#53617f;font-weight:700;font-size:12px}
.num{font-size:30px;letter-spacing:-.04em;color:#202d59}
.symbol{display:grid;place-items:center;min-width:42px;min-height:42px;padding:10px;border-radius:13px;background:#edf0ff;color:#3157d5}
.listitem{gap:13px;padding:15px 0}
.listitem .btn{min-height:38px;padding:8px 11px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;background:#eef1f8;color:#465370;font-size:11px}
.pill.live{background:#dcf8ed;color:#08694f}
.bar{height:9px;background:#e8edf8;border-radius:999px}
.bar i{border-radius:999px;background:linear-gradient(90deg,#3157d5,#7c59df)}
.notice{padding:15px 16px;border:1px solid #d9e5ff;background:#eff5ff;color:#344a7c;border-radius:13px;font-size:13px;line-height:1.65}
.field{gap:8px;margin:14px 0}
.field label{font-size:13px;color:#34415f}
.field input,.field select,.field textarea,.top select{min-height:43px;padding:11px 12px;border:1px solid #ccd6e8;border-radius:11px;color:#18213d}
.field textarea{min-height:105px;line-height:1.65}
.field input:focus,.field select:focus,.field textarea:focus,.top select:focus{outline:3px solid #dce5ff;border-color:#3157d5}
.question{padding:19px;border-radius:15px;background:#fff;border-color:#e1e7f3;border-left:3px solid #b8c6ff;line-height:1.7}
.question:focus-within{border-color:#9aabf7;box-shadow:0 0 0 3px #edf0ff}
.question p{line-height:1.8;font-size:15px}
.question label{cursor:pointer}
.question input[type=radio],.question input[type=checkbox]{width:18px;height:18px;accent-color:#3157d5;vertical-align:middle}
.question textarea,.question select{border-radius:11px}
.formgrid{gap:14px}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#f5f7ff}
.table td,.table th{padding:13px 12px}
.toast{z-index:20000;box-shadow:0 12px 34px #16244733;border:1px solid #ffffff25;line-height:1.5}
.footnote{font-size:12px;line-height:1.7}
.exam-intro{padding:18px 20px;margin:8px 0 20px;border-radius:15px;background:linear-gradient(120deg,#eef2ff,#f5efff);border:1px solid #e1ddff}
.exam-intro h3{margin:10px 0 5px;font-size:20px}
.exam-intro p{margin:0;color:#526080}
.exam-tools{padding:15px 17px;margin:0 0 18px;border:1px solid #dfe5f3;border-radius:14px;background:#fff}
.exam-progress-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:13px;color:#34415f}
.exam-progress-track{height:8px;margin:10px 0 12px;border-radius:999px;background:#e8edf8;overflow:hidden}
.exam-progress-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3157d5,#7554d9);border-radius:999px;transition:width .2s ease}
.question-nav{display:flex;flex-wrap:wrap;gap:7px}
.question-nav .btn{min-width:38px;min-height:38px;padding:7px;border-radius:10px}
.question-nav .btn.answered{background:#dcf8ed;border-color:#a8e6d0;color:#08694f}
.question[id]{scroll-margin-top:24px}
@media(prefers-reduced-motion:reduce){.exam-progress-track i{transition:none}}
.auth-gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 10%,#dce6ff,transparent 40%),radial-gradient(ellipse at 90% 85%,#eadfff,transparent 38%),#f6f7ff}
.auth-panel{width:min(520px,100%);padding:clamp(25px,5vw,44px);border:1px solid #e0e6f4;border-radius:24px;background:#ffffffed;box-shadow:0 22px 70px #2637771a;text-align:center}
.auth-mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,#ffd36a,#ff9c67);color:#26347d;font:800 26px Manrope;box-shadow:0 8px 20px #f4a34038}
.auth-panel h1{margin:12px 0;color:#202d59;font:800 clamp(23px,4vw,30px) Manrope;letter-spacing:-.035em}
.auth-panel p{color:#5f6b85;line-height:1.75}

/* Compact numbered question accordions */

</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script></head><body><div id="app"></div><div class="toast" id="toast"></div><script>
const s={role:'teacher',page:'overview',items:[],loadedFromServer:false,students:[],studentsLoaded:false,attempts:[],attemptsLoaded:false,assessmentLoadError:'',qs:[],currentAssessment:null,answers:{},bundles:[],bundlesLoaded:false,editorMode:'assessment',editingBundleId:null,assessmentFromBundle:false,assessmentEditorOpen:false,bundleEditorOpen:false,sourceBundleId:'',sourceBundleTitle:'',uploadingImage:false,uploadingLabel:'',pendingImageDeletes:[],passages:[]};
const demo=[{id:'ASM-101',title:'Persamaan Kuadrat',subject:'Matematika',className:'Kelas IX-A',duration:60,status:'Aktif'},{id:'ASM-102',title:'Sistem Persamaan Linear',subject:'Matematika',className:'Kelas VIII-B',duration:45,status:'Draft'},{id:'ASM-103',title:'Fungsi dan Grafik',subject:'Matematika',className:'Kelas IX-B',duration:50,status:'Selesai'}];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',3200)}
function go(p){s.page=p;render();if(p==='reports'||p==='progress')loadAttempts();if(p==='students')loadStudents();if(p==='bundles')loadBundles()}
function head(k,t,d,b=''){return '<div class="head"><div><div class="kicker">'+k+'</div><h2>'+t+'</h2><p>'+d+'</p></div>'+b+'</div>'}
function stat(l,n,d){return '<div class="card"><div class="statlabel">'+l+'</div><div class="num">'+n+'</div><div class="muted">'+d+'</div></div>'}
function nav(){let a=s.role==='teacher' ? [['overview','▦ Ringkasan'],['bundles','▣ Bank soal'],['assessments','▤ Jadwal & asesmen'],['students','♙ Siswa'],['reports','▥ Analitik'],['settings','⚙ Pengaturan']] : [['progress','↗ Progres saya'],['assessments','▤ Jadwal ujian'],['settings','⚙ Pengaturan']];return a.map(function(x){return '<button class="'+(s.page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function rows(){
 if(!s.loadedFromServer)return s.assessmentLoadError?'<div class="notice">Daftar asesmen gagal dimuat: '+esc(s.assessmentLoadError)+' <button class="btn" onclick="loadAssessments()">Coba lagi</button></div>':'<p class="muted">Mengambil asesmen dari server…</p>';
 const source=Array.isArray(s.items)?s.items:[];
 if(!source.length)return '<div class="notice">Belum ada asesmen yang tersedia untuk akun ini. Guru dapat membuat asesmen baru, sedangkan siswa hanya melihat asesmen sesuai kelas dan jadwal.</div>';
 return source.map(a=>{
  const id=esc(a.assessmentId||a.id||'');
  const status=String(a.status||'draft');
  return '<div class="listitem"><div class="symbol">∑</div><div class="grow"><b>'+esc(a.title)+'</b><small>'+esc(a.subject||'Umum')+' · '+esc(a.className||'Kelas')+' · '+(a.duration||45)+' menit · '+(a.questionCount||0)+' soal</small></div><span class="pill '+((status==='Aktif'||status==='published')?'live':'')+'">'+esc(status)+'</span><button class="btn" data-assessment-id="'+id+'" onclick="openAssessment(this.dataset.assessmentId)">'+(s.role==='student'?'Buka':'Detail')+'</button>'+(s.role==='teacher'&&status!=='published'?'<button class="btn" data-assessment-id="'+id+'" onclick="deleteAssessment(this.dataset.assessmentId)">Hapus</button>':'')+'</div>';
 }).join('');
}
function overview(){
 const all=Array.isArray(s.items)?s.items:[];
 const published=all.filter(a=>String(a.status)==='published').length;
 const drafts=all.filter(a=>String(a.status)!=='published').length;
 const questionCount=all.reduce((n,a)=>n+Number(a.questionCount||0),0);
 const classes=[...new Set(all.map(a=>String(a.className||'').trim()).filter(Boolean))];
 const classPanel=classes.length?classes.map(name=>{const count=all.filter(a=>String(a.className||'').trim()===name).length;return '<div class="listitem"><div class="symbol">▦</div><div class="grow"><b>'+esc(name)+'</b><small>'+count+' asesmen terkait</small></div><span class="pill">'+count+'</span></div>'}).join(''):'<p class="muted">Ringkasan kelas muncul setelah asesmen dibuat dan ditetapkan ke kelas.</p>';
 return head('DASHBOARD GURU','Selamat datang, '+esc((s.currentUser&&s.currentUser.name)||'Guru')+'!','Ruang kerja untuk merancang asesmen, mengatur jadwal, dan memahami progres belajar.','<button class="btn primary" onclick="newA()">＋ Buat asesmen</button>')+'<div class="grid stats">'+stat('Total asesmen',String(all.length),'Data dari server')+stat('Dipublikasikan',String(published),'Asesmen terbit')+stat('Draft',String(drafts),'Masih dapat disunting')+stat('Jumlah soal',String(questionCount),'Dari seluruh asesmen')+'</div><div class="grid columns"><div class="card"><h3>Asesmen terbaru</h3>'+rows()+'</div><div class="card"><h3>Asesmen per kelas</h3>'+classPanel+'<div class="notice">Tips: gunakan bank soal untuk menyusun asesmen berikutnya lebih cepat. Periksa pratinjau siswa sebelum memublikasikan.</div></div></div>';
}
function assessments(){return head('Jadwal & asesmen','Kelola ujian','Buat jadwal asesmen, tentukan kelas murid, lalu pilih bundel soal dari Bank Soal.','<button class="btn primary" onclick="newA()">＋ Buat asesmen</button>')+'<div class="card"><h3>Semua asesmen</h3>'+rows()+'</div>'+(s.assessmentEditorOpen?editor():'')+'<p class="footnote">Bundel soal disimpan terpisah agar dapat digunakan ulang.</p>'}
function bundlesPage(){return head('Perpustakaan soal','Bank soal & bundel','Simpan kumpulan soal untuk digunakan kembali pada jadwal ujian.','<button class="btn primary" onclick="newBundle()">＋ Buat bundel soal</button>')+'<div class="card"><div class="actions"><h3>Bundel tersimpan</h3><button class="btn" onclick="loadBundles()">Muat ulang</button></div>'+(s.bundlesLoaded?bundleRows():'<p class="muted">Memuat bundel soal...</p>')+'</div>'+(s.bundleEditorOpen&&s.editorMode==='bundle'?editor():'')+'<p class="footnote">Asesmen dari bundel menjadi salinan terpisah; bundel sumber tetap aman.</p>'}
function bundleRows(){if(!s.bundles.length)return '<p class="muted">Belum ada bundel. Klik Buat bundel soal untuk memulai.</p>';return s.bundles.map(function(x){return '<div class="listitem"><div class="symbol">▣</div><div class="grow"><b>'+esc(x.title)+'</b><small>'+esc(x.subject||'Umum')+' · '+Number(x.questionCount||0)+' soal</small></div><button class="btn" onclick="editBundle(\''+esc(x.bundleId)+'\')">Edit bundel</button></div>'}).join('')}
function students(){const list=Array.isArray(s.students)?s.students:[];return head('MANAJEMEN KELAS','Daftar siswa','Identitas dan kelas diambil dari daftar pengguna sekolah yang aktif.')+'<div class="card"><div class="actions"><h3>Pengguna siswa</h3><button class="btn" onclick="loadStudents()">Muat ulang</button></div>'+(!s.studentsLoaded?'<p class="muted">Memuat daftar siswa…</p>':!list.length?'<div class="notice">Belum ada akun siswa aktif pada sheet Users. Daftarkan akun melalui administrator sekolah.</div>':'<table class="table"><thead><tr><th>Nama</th><th>Email sekolah</th><th>Kelas</th><th>Status</th></tr></thead><tbody>'+list.map(u=>'<tr><td>'+esc(u.name||'—')+'</td><td>'+esc(u.email||'—')+'</td><td>'+esc(u.className||'Belum ditetapkan')+'</td><td><span class="pill live">Aktif</span></td></tr>').join('')+'</tbody></table>')+'</div>'}
function reports(){
 const attempts=Array.isArray(s.attempts)?s.attempts:[];
 const pending=attempts.filter(a=>a.status==='needs_review');
 return head('Penilaian','Laporan & penilaian jawaban','Periksa jawaban uraian, gunakan rubrik, lalu tetapkan nilai akhir.')+
 '<div class="grid stats">'+stat('Total pengerjaan',String(attempts.length),'Data dari backend')+stat('Menunggu penilaian',String(pending.length),'Jawaban uraian/menjodohkan')+stat('Sudah dinilai',String(attempts.filter(a=>a.status==='graded').length),'Data dari backend')+stat('Perlu ditinjau',String(pending.length),'Pilih pengerjaan di bawah')+'</div>'+
 '<div class="card"><div class="actions"><h3>Jawaban siswa</h3><button class="btn" onclick="loadAttempts()">Muat ulang</button></div>'+
 (!s.attemptsLoaded?'<p class="muted">Memuat pengerjaan...</p>':!attempts.length?'<p class="muted">Belum ada pengerjaan yang masuk.</p>':attempts.map(a=>{
  const id=esc(a.attemptId||''),answers=a.answers||{},qs=a.questionDetails||[];
  return '<div class="question"><div class="actions"><div><b>'+esc(a.studentId||'Siswa')+' · '+esc(a.assessmentTitle||a.assessmentId||'Asesmen')+'</b><p class="muted">'+esc(a.submittedAt||'')+' · Status: '+esc(a.status||'')+'</p></div><span class="pill '+(a.status==='graded'?'live':'')+'">'+esc(a.status||'')+'</span></div>'+
   qs.map((q,i)=>{const val=answers[q.id];const answerText=val===undefined||val===null||val===''?'(Tidak dijawab)':typeof val==='object'&&q.subquestions&&q.subquestions.length?q.subquestions.map((sub,j)=>sub+': '+(val[String(j)]||'(Tidak dijawab)')).join(String.fromCharCode(10)):typeof val==='object'?JSON.stringify(val):String(val);
    return '<div class="question"><b>Soal '+(i+1)+' · '+esc(q.points)+' poin maksimum</b><p>'+esc(q.text||'')+'</p>'+(q.subquestions&&q.subquestions.length?'<ul>'+q.subquestions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'<p><b>Jawaban siswa:</b></p><div style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(answerText)+'</div>'+((val&&typeof val==='object'&&Array.isArray(val.photos)&&val.photos.length)?'<div class="essay-photo-list"><b>Foto jawaban:</b>'+val.photos.map(function(photo,index){return '<div>📎 <a href="'+esc(photo.url)+'" target="_blank" rel="noopener">'+esc(photo.name||('Foto jawaban '+(index+1)))+'</a></div>'}).join('')+'</div>':'')+((q.rubricLevels&&q.rubricLevels.length)?'<p><b>Panduan rubrik:</b></p><ol>'+q.rubricLevels.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'')+'</div>';
   }).join('')+
   '<div class="formgrid"><div class="field"><label>Nilai akhir</label><input id="gradeScore_'+id+'" type="number" min="0" max="'+esc(a.maxScore||0)+'" step="0.5" value="'+esc(a.score||0)+'"></div><div class="field"><label>Nilai maksimum</label><input id="gradeMax_'+id+'" type="number" min="0" value="'+esc(a.maxScore||0)+'"></div></div><div class="field"><label>Umpan balik guru</label><textarea id="gradeFeedback_'+id+'" rows="2">'+esc(a.teacherFeedback||'')+'</textarea></div><div class="actions"><button class="btn primary" onclick="saveGrade(\''+id+'\')">Simpan nilai akhir</button></div></div>';
 }).join(''))+'</div>';
}
async function loadStudents(){s.studentsLoaded=false;render();try{const r=await api('listStudents',{});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Tidak dapat memuat siswa');s.students=Array.isArray(r.data)?r.data:[];s.studentsLoaded=true;render()}catch(e){s.students=[];s.studentsLoaded=true;render();toast('Gagal memuat daftar siswa: '+e.message)}}
async function loadAttempts(){
 s.attemptsLoaded=false;render();
 try{const r=await api('listAttempts',{});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Tidak dapat memuat pengerjaan');s.attempts=Array.isArray(r.data)?r.data:[];s.attemptsLoaded=true;render();}
 catch(e){s.attempts=[];s.attemptsLoaded=true;render();toast('Gagal memuat jawaban siswa: '+e.message)}
}
async function saveGrade(id){
 const scoreEl=document.getElementById('gradeScore_'+id),maxEl=document.getElementById('gradeMax_'+id),feedbackEl=document.getElementById('gradeFeedback_'+id);
 const score=Number(scoreEl&&scoreEl.value),maxScore=Number(maxEl&&maxEl.value);
 try{const r=await api('gradeAttempt',{attemptId:id,score,maxScore,feedback:feedbackEl?feedbackEl.value:''});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Nilai gagal disimpan');toast('Nilai akhir berhasil disimpan.');await loadAttempts();}
 catch(e){toast('Gagal menyimpan nilai: '+e.message)}
}

function progress() {
  const attempts = Array.isArray(s.attempts) ? s.attempts : [];
  const graded = attempts.filter(a => a.status === 'graded' && Number(a.maxScore) > 0);
  const average = graded.length
    ? Math.round(graded.reduce((sum, a) => sum + (Number(a.score) || 0) / Number(a.maxScore) * 100, 0) / graded.length)
    : null;
  const statsHtml = '<div class="grid stats">'
    + stat('Pengerjaan terkirim', String(attempts.length), 'Riwayat akun ini')
    + stat('Sudah dinilai', String(graded.length), 'Nilai telah tersedia')
    + stat('Rata-rata nilai', average === null ? '—' : average + '%', 'Dari pengerjaan yang dinilai')
    + stat('Perlu diperiksa', String(attempts.filter(a => a.status === 'needs_review').length), 'Menunggu koreksi guru')
    + '</div>';
  const rows = attempts.map(function (a) {
    const score = a.status === 'graded' && Number(a.maxScore) > 0
      ? Math.round(Number(a.score) / Number(a.maxScore) * 100) + '%'
      : '—';
    const statusLabel = a.status === 'graded' ? 'Sudah dinilai' : 'Menunggu koreksi';
    const pillClass = a.status === 'graded' ? 'live' : '';
    return '<div class="listitem"><div class="symbol">✓</div><div class="grow"><b>'
      + esc(a.assessmentTitle || a.assessmentId || 'Asesmen')
      + '</b><small>' + esc(a.submittedAt || '')
      + '</small></div><span class="pill ' + pillClass + '">'
      + esc(statusLabel) + '</span><strong>' + score + '</strong></div>';
  }).join('');
  const history = !s.attemptsLoaded
    ? '<p class="muted">Memuat riwayat…</p>'
    : !attempts.length
      ? '<p class="muted">Belum ada pengerjaan yang tercatat pada akun ini.</p>'
      : rows;
  return head('RUANG SISWA', 'Perkembangan belajarku', 'Lihat riwayat pengerjaan dan nilai yang sudah dinilai.')
    + statsHtml
    + '<div class="card"><div class="actions"><h3>Riwayat asesmen</h3><button class="btn" onclick="loadAttempts()">Muat ulang</button></div>'
    + history + '</div>';
}
function settings(){return head('Konfigurasi','Koneksi aplikasi','Rumble Assessment menggunakan Apps Script HTML Service.')+'<div class="card"><h3>Status backend</h3><p class="muted">Halaman ini berjalan melalui Apps Script. Koneksi menggunakan google.script.run sehingga tidak memerlukan URL API di browser.</p><div class="actions"><button class="btn primary" onclick="testApi()">Uji koneksi</button></div><div class="notice">Akses aplikasi tetap dibatasi oleh pengaturan deployment Apps Script. Sebelum menggunakan data siswa asli, pastikan izin setiap peran telah diterapkan di sisi server.</div></div>'}
function newBundle(){s.page='bundles';s.bundleEditorOpen=true;s.assessmentEditorOpen=false;s.assessmentFromBundle=false;s.sourceBundleId='';s.sourceBundleTitle='';s.pendingImageDeletes=[];s.editorMode='bundle';s.editingBundleId=null;s.editingId=null;s.meta={title:'',subject:'Matematika',description:'',passageText:'',passageImageUrl:''};s.passages=[];s.qs=[{type:'multiple_choice',text:'',points:1,options:['','','','',''],optionImages:[],answer:'0',imageUrl:'',subquestions:[],rubricLevels:[],passageId:''}];render();setTimeout(function(){document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})},0)}
async function loadBundles(){try{const r=await api('listQuestionBundles');if(!r||!r.ok)throw Error(r&&r.error?r.error:'Gagal memuat bank soal');s.bundles=Array.isArray(r.data)?r.data:[];s.bundlesLoaded=true;if(s.page==='bundles'||(s.page==='assessments'&&s.assessmentEditorOpen))render()}catch(e){toast('Gagal memuat bank soal: '+e.message)}}
async function useBundle(id){try{const r=await api('getQuestionBundle',{id:id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Bundel tidak tersedia');const b=r.data.bundle||{};s.editorMode='assessment';s.bundleEditorOpen=false;s.assessmentEditorOpen=true;s.assessmentFromBundle=true;s.sourceBundleId=b.bundleId||id;s.sourceBundleTitle=b.title||'';s.editingBundleId=null;s.editingId=null;s.meta={title:b.title||'',subject:b.subject||'Matematika',className:'',duration:60,startAt:'',endAt:'',passageText:b.passageText||'',passageImageUrl:b.passageImageUrl||'',sourceBundleId:b.bundleId||id,sourceBundleTitle:b.title||''};s.passages=normalizeBundlePassages(b,r.data.questions||[]);s.qs=(r.data.questions||[]).map(function(q){return Object.assign({},q,{options:q.options||[],optionImages:q.optionImages||[],subquestions:q.subquestions||[],rubricLevels:q.rubricLevels||[],passageId:q.passageId||''})}).map(resolveQuestionPassage);s.page='assessments';s.assessmentEditorOpen=true;render();setTimeout(function(){document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})},0);toast('Bundel dimuat sebagai salinan asesmen baru.')}catch(e){toast('Gagal menggunakan bundel: '+e.message)}}
async function editBundle(id){try{const r=await api('getQuestionBundle',{id:id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Bundel tidak tersedia');const b=r.data.bundle||{};s.assessmentFromBundle=false;s.sourceBundleId='';s.sourceBundleTitle='';s.editorMode='bundle';s.bundleEditorOpen=true;s.assessmentEditorOpen=false;s.editingBundleId=b.bundleId;s.editingId=null;s.meta={title:b.title||'',subject:b.subject||'Matematika',description:b.description||'',passageText:b.passageText||'',passageImageUrl:b.passageImageUrl||''};s.passages=normalizeBundlePassages(b,r.data.questions||[]);s.qs=(r.data.questions||[]).map(function(q){return Object.assign({},q,{options:q.options||[],optionImages:q.optionImages||[],subquestions:q.subquestions||[],rubricLevels:q.rubricLevels||[],passageId:q.passageId||''})});s.page='bundles';render();setTimeout(function(){document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})},0)}catch(e){toast('Gagal membuka bundel: '+e.message)}}
async function saveBundle(){const title=document.getElementById('title').value.trim();if(!title||!s.qs.length){toast('Isi nama bundel dan minimal satu soal.');return}const payload={bundleId:s.editingBundleId||undefined,title:title,subject:document.getElementById('subject').value,description:document.getElementById('className').value,passageText:(s.meta||{}).passageText||'',passageImageUrl:(s.meta||{}).passageImageUrl||'',passages:s.passages||[],questions:s.qs.map(function(q){const copy=Object.assign({},q);delete copy.passageText;delete copy.passageImageUrl;return copy})};try{const r=await api('saveQuestionBundle',payload);if(!r||!r.ok)throw Error(r&&r.error?r.error:'Bundel gagal disimpan');await processPendingImageDeletes();toast('Bundel soal tersimpan di bank soal.');s.pendingImageDeletes=[];s.qs=[];s.passages=[];s.meta={};s.editingBundleId=null;s.bundleEditorOpen=false;s.editorMode='bundle';s.page='bundles';await loadBundles();render()}catch(e){toast('Gagal menyimpan bundel: '+e.message)}}
function newA(){s.assessmentFromBundle=false;s.sourceBundleId='';s.sourceBundleTitle='';s.passages=[];s.page='assessments';s.editorMode='assessment';s.bundleEditorOpen=false;s.assessmentEditorOpen=true;s.editingBundleId=null;s.pendingImageDeletes=[];s.editingId=null;s.meta={title:'',subject:'Matematika',className:'',duration:60,startAt:'',endAt:'',passageText:'',passageImageUrl:''};s.qs=[];render();loadBundles();setTimeout(()=>document.getElementById('editor')?.scrollIntoView({behavior:'smooth'}),0)}
async function chooseAssessmentBundle(id){if(!id){s.sourceBundleId='';s.sourceBundleTitle='';s.assessmentFromBundle=false;s.qs=[];s.passages=[];render();return}try{const r=await api('getQuestionBundle',{id:id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Bundel tidak tersedia');const b=r.data.bundle||{};s.assessmentFromBundle=true;s.sourceBundleId=b.bundleId||id;s.sourceBundleTitle=b.title||'';s.meta.subject=b.subject||s.meta.subject||'Matematika';s.meta.sourceBundleId=s.sourceBundleId;s.meta.sourceBundleTitle=s.sourceBundleTitle;s.passages=normalizeBundlePassages(b,r.data.questions||[]);s.qs=(r.data.questions||[]).map(function(q){return Object.assign({},q,{options:q.options||[],optionImages:q.optionImages||[],subquestions:q.subquestions||[],rubricLevels:q.rubricLevels||[],passageId:q.passageId||''})}).map(resolveQuestionPassage);render();toast('Bundel soal dimuat. Lengkapi jadwal dan kelas murid.')}catch(e){toast('Gagal memuat bundel: '+e.message)}}
function normalizeBundlePassages(bundle,questions){let ps=Array.isArray(bundle.passages)?bundle.passages.map(p=>Object.assign({},p)):[];if(!ps.length){(questions||[]).forEach((q,i)=>{if(q.passageText||q.passageImageUrl){const id='legacy-'+i;ps.push({id,title:'Bacaan '+(ps.length+1),text:q.passageText||'',imageUrl:q.passageImageUrl||''});q.passageId=id}})}return ps.map((p,i)=>({id:p.id||('passage-'+(i+1)),title:p.title||('Bacaan '+(i+1)),text:p.text||'',imageUrl:p.imageUrl||''}))}
function resolveQuestionPassage(q){const p=(s.passages||[]).find(x=>x.id===q.passageId);if(p){q.passageText=p.text||'';q.passageImageUrl=p.imageUrl||''}else if(!q.passageId){q.passageText='';q.passageImageUrl=''}return q}
function addPassage(){s.passages=s.passages||[];s.passages.push({id:'passage-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:'Bacaan '+(s.passages.length+1),text:'',imageUrl:''});render()}
function removePassage(i){const p=s.passages[i];if(!p)return;if(!confirm('Hapus '+p.title+'? Soal yang memakai bacaan ini akan diatur menjadi tanpa bacaan.'))return;s.qs.forEach(q=>{if(q.passageId===p.id){q.passageId='';q.passageText='';q.passageImageUrl=''}});if(p.imageUrl){s.pendingImageDeletes=s.pendingImageDeletes||[];s.pendingImageDeletes.push(p.imageUrl)}s.passages.splice(i,1);render()}
function selectQuestionPassage(i,id){const q=s.qs[i];q.passageId=id||'';resolveQuestionPassage(q);render()}

function previewMath(el){const box=el.nextElementSibling;if(!box||!box.classList.contains('math-preview'))return;box.textContent=el.value;renderMath(box)}
function renderMath(root){if(!root)return;try{const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;const invisibleFunction=String.fromCharCode(8289);while((node=walker.nextNode())){if(node.nodeValue&&node.nodeValue.includes(invisibleFunction))node.nodeValue=node.nodeValue.split(invisibleFunction).join('');}}catch(e){}if(typeof renderMathInElement!=='function')return;try{renderMathInElement(root,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false,strict:'ignore'});}catch(e){}}

function handleEquationPaste(event,el,kind,i,j){
 const cd=event.clipboardData;if(!cd)return;
 const items=Array.from(cd.items||[]);const imageItem=items.find(item=>item.kind==='file'&&/^image\//.test(item.type));
 if(imageItem){
  if(kind==='passage'){event.preventDefault();const file=imageItem.getAsFile();if(file)uploadImageBlob(file,file.name||'gambar-bacaan.png','passage');return;}
  event.preventDefault();const file=imageItem.getAsFile();if(file)uploadImageBlob(file,file.name||'gambar-soal.png',kind,i,j);return;
 }
 let text=cd.getData('text/plain');
 if(!text){const html=cd.getData('text/html');if(html){const tmp=document.createElement('div');tmp.innerHTML=html;text=tmp.textContent||tmp.innerText||'';}}
 if(!text)return;
 const hasMath=/[=^_]|[√∫≤≥×÷±]/.test(text)||text.includes('\\');
 if(hasMath&&!text.includes('$')&&!text.includes('\\(')&&!text.includes('\\[')){
  event.preventDefault();const start=el.selectionStart||0,end=el.selectionEnd||start;const value='\\('+text+'\\)';
  if(typeof el.setRangeText==='function')el.setRangeText(value,start,end,'end');else el.value=el.value.slice(0,start)+value+el.value.slice(end);
  if(kind==='question'&&s.qs[i])s.qs[i].text=el.value;
  else if(kind==='questionPassage'&&s.qs[i])s.qs[i].passageText=el.value;
  else if(kind==='libraryPassage'&&s.passages[i])s.passages[i].text=el.value;
  else if(kind==='statement'&&s.qs[i]?.subquestions)s.qs[i].subquestions[j]=el.value;
  else if(kind==='essaySubquestions'&&s.qs[i])s.qs[i].subquestions=el.value.split(String.fromCharCode(10)).filter(x=>x.trim());
  else if(kind==='essayRubric'&&s.qs[i]){s.qs[i].rubricLevels=el.value.split(String.fromCharCode(10));s.qs[i]._rubricEdited=true;}
  else if(kind==='option'&&s.qs[i])s.qs[i].options[j]=el.value;
  else if(kind==='passage'&&s.meta)s.meta.passageText=el.value;
  else if(kind==='matchingLeft'&&s.qs[i]?.pairs?.[j])s.qs[i].pairs[j].left=el.value;
  else if(kind==='matchingRight'&&s.qs[i]?.pairs?.[j])s.qs[i].pairs[j].right=el.value;
  else if(kind==='statement'&&s.qs[i]?.subquestions)s.qs[i].subquestions[j]=el.value;
  previewMath(el);
 }
}

function imageUrlFor(kind,i,j){if(kind==='libraryPassage')return s.passages?.[i]?.imageUrl||'';if(kind==='passage')return (s.meta||{}).passageImageUrl||'';if(kind==='question')return s.qs[i]?.imageUrl||'';if(kind==='questionPassage')return s.qs[i]?.passageImageUrl||'';if(kind==='matchingLeft'||kind==='matchingRight')return s.qs[i]?.pairs?.[j]?.[kind==='matchingLeft'?'leftImageUrl':'rightImageUrl']||'';if(kind==='statement')return s.qs[i]?.subquestionImages?.[j]||'';return s.qs[i]?.optionImages?.[j]||''}

async function uploadImageBlob(file,name,kind,i,j){
 if(file.size>4*1024*1024){toast('Ukuran gambar maksimal 4 MB.');return}
 if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){toast('Gunakan gambar JPG, PNG, WebP, atau GIF.');return}
 if(s.uploadingImage){toast('Tunggu hingga unggahan sebelumnya selesai.');return}
 const previousUrl=imageUrlFor(kind,i,j);
 s.uploadingImage=true;s.uploadingLabel='Mengunggah gambar '+(kind==='passage'?'bacaan':kind==='question'?'soal':kind==='questionPassage'?'bacaan soal':kind==='matchingLeft'?'kolom kiri':kind==='matchingRight'?'kolom kanan':'opsi jawaban')+'...';render();
 try{
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Gagal membaca gambar'));reader.readAsDataURL(file)});
  const base64=String(dataUrl).split(',')[1]||'';
  const uploadKind=kind==='libraryPassage'?'passage':kind;
  const result=await api('uploadAssessmentImage',{fileName:name,mimeType:file.type,base64,kind:uploadKind,assessmentId:s.editingId||((s.currentAssessment||{}).assessment||{}).assessmentId||''});
  if(!result||!result.ok)throw Error(result&&result.error?result.error:'Upload gambar gagal');
  const url=result.data.imageUrl||result.data.url;
  setImageUrl(kind,i,j,url);
  if(previousUrl&&previousUrl!==url){s.pendingImageDeletes=s.pendingImageDeletes||[];s.pendingImageDeletes.push(previousUrl);}
  toast(result.data.warning?'Gambar tersimpan. '+result.data.warning:'Gambar berhasil diunggah ke Drive.');
 }catch(e){toast('Gagal mengunggah gambar: '+e.message)}
 finally{s.uploadingImage=false;s.uploadingLabel='';render()}
}

async function loadCurrentUser(){
  try {
    const response = await api('getCurrentUser');
    if (!response || !response.ok) {
      throw new Error(response && response.error ? response.error : 'Respons verifikasi akun tidak valid.');
    }
    const auth = response.data || {};
    s.authChecked = true;
    s.authenticated = auth.authenticated === true;
    s.currentUser = auth.user || null;
    s.authReason = auth.reason || '';
    if (s.authenticated && s.currentUser) {
      s.role = s.currentUser.role === 'student' ? 'student' : 'teacher';
      s.page = s.role === 'student' ? 'progress' : 'overview';
      render();
      await loadAssessments();
    } else {
      render();
    }
  } catch (error) {
    console.error('Rumble authentication:', error);
    s.authChecked = true;
    s.authenticated = false;
    s.currentUser = null;
    s.authReason = 'error';
    render();
    toast('Verifikasi akun gagal: ' + (error && error.message ? error.message : error));
  }
}

async function retryAuth(){s.authChecked=false;s.authReason='';render();await loadCurrentUser()}
