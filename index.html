x 0 5px}.listitem{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.symbol{background:#eaf2ff;color:var(--blue);padding:12px;border-radius:10px;font-weight:800}.grow{flex:1;min-width:0}.grow b{display:block;margin-bottom:5px}.grow small{color:var(--muted)}.pill{font-size:10px;font-weight:700;border-radius:30px;padding:5px 8px;background:#edf2f7}.pill.live{background:#e3f7ef;color:var(--green)}.bar{height:7px;border-radius:8px;background:#edf1f6;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--blue)}.notice{padding:13px;background:#edf5ff;border-radius:10px;color:#34567e;font-size:12px;line-height:1.6}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d6dfeb;border-radius:8px;background:white}.field textarea{min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.question{border:1px solid var(--line);border-radius:11px;padding:15px;margin:13px 0;background:#fafcff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted)}.hidden{display:none}.toast{display:none;position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:13px 18px;border-radius:10px;max-width:360px}.footnote{font-size:11px;line-height:1.6;color:var(--muted);margin-top:20px}/* Standardized editor rows: text and image controls align side-by-side. */

</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script></head><body><div id="app"></div><div class="toast" id="toast"></div><script>
const s={role:'teacher',page:'overview',items:[],loadedFromServer:false,qs:[],currentAssessment:null,answers:{},bundles:[],bundlesLoaded:false,editorMode:'assessment',editingBundleId:null,assessmentFromBundle:false,sourceBundleId:'',sourceBundleTitle:'',uploadingImage:false,uploadingLabel:'',pendingImageDeletes:[],passages:[]};
const demo=[{id:'ASM-101',title:'Persamaan Kuadrat',subject:'Matematika',className:'Kelas IX-A',duration:60,status:'Aktif'},{id:'ASM-102',title:'Sistem Persamaan Linear',subject:'Matematika',className:'Kelas VIII-B',duration:45,status:'Draft'},{id:'ASM-103',title:'Fungsi dan Grafik',subject:'Matematika',className:'Kelas IX-B',duration:50,status:'Selesai'}];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',3200)}
function go(p){s.page=p;render();if(p==='reports')loadAttempts();if(p==='bundles')loadBundles()}function role(r){s.role=r;s.page=r==='teacher'?'overview':'progress';s.currentAssessment=null;render();loadAssessments()}
function head(k,t,d,b=''){return '<div class="head"><div><div class="kicker">'+k+'</div><h2>'+t+'</h2><p>'+d+'</p></div>'+b+'</div>'}
function stat(l,n,d){return '<div class="card"><div class="statlabel">'+l+'</div><div class="num">'+n+'</div><div class="muted">'+d+'</div></div>'}
function nav(){let a=s.role==='teacher' ? [['overview','▦ Ringkasan'],['bundles','▣ Bank soal'],['assessments','▤ Jadwal & asesmen'],['students','♙ Siswa'],['reports','▥ Analitik'],['settings','⚙ Pengaturan']] : [['progress','↗ Progres saya'],['assessments','▤ Jadwal ujian'],['settings','⚙ Pengaturan']];return a.map(function(x){return '<button class="'+(s.page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function rows(){
 const source=s.loadedFromServer?s.items:(s.items.length?s.items:demo);
 if(!source.length)return '<p class="muted">Belum ada asesmen tersimpan di backend.</p>';
 return source.map(a=>{
  const id=esc(a.assessmentId||a.id||'');
  const status=String(a.status||'draft');
  return '<div class="listitem"><div class="symbol">∑</div><div class="grow"><b>'+esc(a.title)+'</b><small>'+esc(a.subject||'Umum')+' · '+esc(a.className||'Kelas')+' · '+(a.duration||45)+' menit · '+(a.questionCount||0)+' soal</small></div><span class="pill '+((status==='Aktif'||status==='published')?'live':'')+'">'+esc(status)+'</span><button class="btn" onclick="openAssessment(\''+id+'\')">'+(s.role==='student'?'Buka':'Detail')+'</button></div>';
 }).join('');
}
function overview(){return head('Dashboard guru','Selamat datang kembali','Pantau asesmen, aktivitas kelas, dan hasil belajar siswa.','<button class="btn primary" onclick="newA()">＋ Buat asesmen</button>')+'<div class="grid stats">'+stat('Total asesmen','12','3 aktif semester ini')+stat('Siswa terdaftar','186','Di 6 kelas belajar')+stat('Rata-rata nilai','81,4','Data contoh')+stat('Perlu diperiksa','8','Jawaban esai menunggu')+'</div><div class="grid columns"><div class="card"><h3>Asesmen terbaru</h3>'+rows()+'</div><div class="card"><h3>Ringkasan kelas</h3>'+[['IX-A',86],['VIII-B',79],['IX-B',74],['VII-A',91]].map(a=>'<p>'+a[0]+' <span style="float:right">'+a[1]+'/100</span></p><div class="bar"><i style="width:'+a[1]+'%"></i></div>').join('')+'<div class="notice">Analisis butir dapat membantu mengenali soal yang terlalu mudah atau sulit.</div></div></div>'}
function assessments(){return head('Jadwal & asesmen','Kelola ujian','Buat jadwal asesmen, tentukan kelas murid, lalu pilih bundel soal dari Bank Soal.','<button class="btn primary" onclick="newA()">＋ Buat asesmen</button>')+'<div class="card"><h3>Semua asesmen</h3>'+rows()+'</div>'+(s.qs.length?editor():'')+'<p class="footnote">Bundel soal disimpan terpisah agar dapat digunakan ulang.</p>'}
function bundlesPage(){return head('Perpustakaan soal','Bank soal & bundel','Simpan kumpulan soal untuk digunakan kembali pada jadwal ujian.','<button class="btn primary" onclick="newBundle()">＋ Buat bundel soal</button>')+'<div class="card"><div class="actions"><h3>Bundel tersimpan</h3><button class="btn" onclick="loadBundles()">Muat ulang</button></div>'+(s.bundlesLoaded?bundleRows():'<p class="muted">Memuat bundel soal...</p>')+'</div>'+(s.qs.length?editor():'')+'<p class="footnote">Asesmen dari bundel menjadi salinan terpisah; bundel sumber tetap aman.</p>'}
function bundleRows(){if(!s.bundles.length)return '<p class="muted">Belum ada bundel. Klik Buat bundel soal untuk memulai.</p>';return s.bundles.map(function(x){return '<div class="listitem"><div class="symbol">▣</div><div class="grow"><b>'+esc(x.title)+'</b><small>'+esc(x.subject||'Umum')+' · '+Number(x.questionCount||0)+' soal</small></div><button class="btn" onclick="editBundle(\''+esc(x.bundleId)+'\')">Edit bundel</button></div>'}).join('')}
function students(){return head('Manajemen kelas','Daftar siswa','Ringkasan siswa dan status pengerjaan.')+'<div class="card"><h3>Siswa terdaftar (contoh)</h3><table class="table"><tr><th>Nama</th><th>Kelas</th><th>Selesai</th><th>Rata-rata</th></tr><tr><td>Alya Putri</td><td>IX-A</td><td>8/9</td><td>91</td></tr><tr><td>Bima Pratama</td><td>IX-A</td><td>7/9</td><td>84</td></tr><tr><td>Citra Lestari</td><td>VIII-B</td><td>9/9</td><td>88</td></tr></table></div>'}
function reports(){
 const attempts=Array.isArray(s.attempts)?s.attempts:[];
 const pending=attempts.filter(a=>a.status==='needs_review');
 return head('Penilaian','Laporan & penilaian jawaban','Periksa jawaban uraian, gunakan rubrik, lalu tetapkan nilai akhir.')+
 '<div class="grid stats">'+stat('Total pengerjaan',String(attempts.length),'Data dari backend')+stat('Menunggu penilaian',String(pending.length),'Jawaban uraian/menjodohkan')+stat('Sudah dinilai',String(attempts.filter(a=>a.status==='graded').length),'Data dari backend')+stat('Perlu ditinjau',String(pending.length),'Pilih pengerjaan di bawah')+'</div>'+
 '<div class="card"><div class="actions"><h3>Jawaban siswa</h3><button class="btn" onclick="loadAttempts()">Muat ulang</button></div>'+
 (!s.attemptsLoaded?'<p class="muted">Memuat pengerjaan...</p>':!attempts.length?'<p class="muted">Belum ada pengerjaan yang masuk.</p>':attempts.map(a=>{
  const id=esc(a.attemptId||''),answers=a.answers||{},qs=a.questionDetails||[];
  return '<div class="question"><div class="actions"><div><b>'+esc(a.studentId||'Siswa')+' · '+esc(a.assessmentTitle||a.assessmentId||'Asesmen')+'</b><p class="muted">'+esc(a.submittedAt||'')+' · Status: '+esc(a.status||'')+'</p></div><span class="pill '+(a.status==='graded'?'live':'')+'">'+esc(a.status||'')+'</span></div>'+
   qs.map((q,i)=>{const val=answers[q.id];const answerText=val===undefined||val===null||val===''?'(Tidak dijawab)':typeof val==='object'&&q.subquestions&&q.subquestions.length?q.subquestions.map((sub,j)=>sub+': '+(val[String(j)]||'(Tidak dijawab)')).join(String.fromCharCode(10)):typeof val==='object'?JSON.stringify(val):String(val);

function syncBusyOverlay(){

function beginBusy(action){busyRequests++;busyLabels.push(busyActionLabels[action]||busyActionLabels.default);syncBusyOverlay()}

function api(action,payload={}){

  if(!window.google||!google.script||!google.script.run){reject(new Error('google.script.run tidak tersedia. Buka aplikasi melalui URL deployment Apps Script.'));return}

  catch(err){finish();reject(err)}
 });
}

 const title=document.getElementById('title').value.trim();
 if(!title||!s.qs.length||!s.sourceBundleId){toast('Isi judul, pilih bundel soal dari Bank Soal, dan pastikan soal berhasil dimuat.');return}

function defaultRubricLevels(points,subquestions){
 const max=Math.max(1,Math.min(20,Number(points)||1));
 return Array.from({length:max+1},(_,score)=>score===0?'0 = Tidak menjawab':score===max?score+' = Seluruh bagian dijawab benar':score===1?'1 = Menjawab tetapi tidak relevan':score+' = Menjawab benar '+(score-1)+' subpertanyaan');
}
function updatePoints(i,value){const q=s.qs[i];q.points=Number(value)||0;if(q.type==='essay'&&!q._rubricEdited)q.rubricLevels=defaultRubricLevels(q.points,q.subquestions);}
async function editAssessment(id){
 try{
  const r=await api('getAssessment',{id,includeAnswers:true});
  if(!r||!r.ok)throw Error(r&&r.error?r.error:'Asesmen tidak tersedia');
  const d=r.data,a=d.assessment||{},isPublished=a.status==='published';
  s.editingId=isPublished?null:id;
  s.meta={title:(isPublished?'Salinan - ':'')+(a.title||''),subject:a.subject||'Matematika',className:a.className||'',duration:a.duration||60,startAt:a.startAt||'',endAt:a.endAt||'',passageText:a.passageText||'',passageImageUrl:a.passageImageUrl||''};
  s.qs=(d.questions||[]).map(q=>({...q,answer:q.answer===undefined?'0':q.answer,options:q.options||[],optionImages:q.optionImages||[],subquestions:q.subquestions||[],subquestionImages:q.subquestionImages||[],rubricLevels:q.rubricLevels||[],_rubricEdited:!!(q.rubricLevels&&q.rubricLevels.length)}));
  s.currentAssessment=null;s.page='assessments';render();setTimeout(()=>document.getElementById('editor')?.scrollIntoView({behavior:'smooth'}),0);

async function loadAssessments(){
 try{
  const r=await api('listAssessments',s.role==='student'?{status:'published'}:{});
  if(!r||!r.ok)throw Error(r&&r.error?r.error:'Respons backend tidak valid');
  s.items=Array.isArray(r.data)?r.data.map(a=>Object.assign({},a,{id:a.assessmentId||a.id})):[];s.loadedFromServer=true;render();
 }catch(e){console.warn('Rumble API:',e);toast('Belum dapat memuat asesmen dari server: '+e.message)}

function previewMath(el){const box=el.nextElementSibling;if(!box||!box.classList.contains('math-preview'))return;box.textContent=el.value;renderMath(box)}
function renderMath(root){if(typeof renderMathInElement!=='function')return;try{renderMathInElement(root,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});}catch(e){}}
function setSubAnswer(id,index,value){const current=s.answers[id]&&typeof s.answers[id]==='object'?s.answers[id]:{};current[String(index)]=value;s.answers[id]=current}
function handleEquationPaste(event,el,kind,i,j){
 const cd=event.clipboardData;if(!cd)return;
 const items=Array.from(cd.items||[]);const imageItem=items.find(item=>item.kind==='file'&&/^image\//.test(item.type));
 if(imageItem){
  if(kind==='passage'){event.preventDefault();const file=imageItem.getAsFile();if(file)uploadImageBlob(file,file.name||'gambar-bacaan.png','passage');return;}
  event.preventDefault();const file=imageItem.getAsFile();if(file)uploadImageBlob(file,file.name||'gambar-soal.png',kind,i,j);return;
 }
 let text=cd.getData('text/plain');
 if(!text){const html=cd.getData('text/html');if(html){const tmp=document.createElement('div');tmp.innerHTML=html;text=tmp.textContent||tmp.innerText||'';}}
 if(!text)return;
 const hasMath=/[=^_]|[√∫≤≥×÷±]/.test(text)||text.includes('\\');
 if(hasMath&&!text.includes('$')&&!text.includes('\\(')&&!text.includes('\\[')){
  event.preventDefault();const start=el.selectionStart||0,end=el.selectionEnd||start;const value='\\('+text+'\\)';
  if(typeof el.setRangeText==='function')el.setRangeText(value,start,end,'end');else el.value=el.value.slice(0,start)+value+el.value.slice(end);
  if(kind==='question'&&s.qs[i])s.qs[i].text=el.value;
  else if(kind==='questionPassage'&&s.qs[i])s.qs[i].passageText=el.value;
  else if(kind==='libraryPassage'&&s.passages[i])s.passages[i].text=el.value;
  else if(kind==='statement'&&s.qs[i]?.subquestions)s.qs[i].subquestions[j]=el.value;
  else if(kind==='essaySubquestions'&&s.qs[i])s.qs[i].subquestions=el.value.split(String.fromCharCode(10)).filter(x=>x.trim());
  else if(kind==='essayRubric'&&s.qs[i]){s.qs[i].rubricLevels=el.value.split(String.fromCharCode(10));s.qs[i]._rubricEdited=true;}
  else if(kind==='option'&&s.qs[i])s.qs[i].options[j]=el.value;
  else if(kind==='passage'&&s.meta)s.meta.passageText=el.value;
  else if(kind==='matchingLeft'&&s.qs[i]?.pairs?.[j])s.qs[i].pairs[j].left=el.value;
  else if(kind==='matchingRight'&&s.qs[i]?.pairs?.[j])s.qs[i].pairs[j].right=el.value;
  else if(kind==='statement'&&s.qs[i]?.subquestions)s.qs[i].subquestions[j]=el.value;
  previewMath(el);
 }
}
function uploadQuestionImage(event,i){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'question',i)}
function uploadQuestionPassageImage(event,i){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'questionPassage',i)}
function uploadOptionImage(event,i,j){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'option',i,j)}
function uploadPassageImage(event){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'passage')}
function uploadLibraryPassageImage(event,i){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'libraryPassage',i)}
function removeLibraryPassageImage(i){removeAssessmentImage('libraryPassage',i)}
function uploadStatementImage(event,i,j){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'statement',i,j)}
function uploadMatchingImage(event,i,j,side){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,side==='left'?'matchingLeft':'matchingRight',i,j)}
function removeMatchingImage(i,j,side){removeAssessmentImage(side==='left'?'matchingLeft':'matchingRight',i,j)}
function imageFileId(url){const match=String(url||'').match(/[?&]id=([^&]+)/)||String(url||'').match(/\/d\/([^/]+)/);return match?decodeURIComponent(match[1]):''}
function imageUrlFor(kind,i,j){if(kind==='libraryPassage')return s.passages?.[i]?.imageUrl||'';if(kind==='passage')return (s.meta||{}).passageImageUrl||'';if(kind==='question')return s.qs[i]?.imageUrl||'';if(kind==='questionPassage')return s.qs[i]?.passageImageUrl||'';if(kind==='matchingLeft'||kind==='matchingRight')return s.qs[i]?.pairs?.[j]?.[kind==='matchingLeft'?'leftImageUrl':'rightImageUrl']||'';if(kind==='statement')return s.qs[i]?.subquestionImages?.[j]||'';return s.qs[i]?.optionImages?.[j]||''}
function setImageUrl(kind,i,j,url){if(kind==='libraryPassage'&&s.passages?.[i])s.passages[i].imageUrl=url;else if(kind==='passage'){s.meta=s.meta||{};s.meta.passageImageUrl=url}else if(kind==='question'&&s.qs[i])s.qs[i].imageUrl=url;else if(kind==='questionPassage'&&s.qs[i])s.qs[i].passageImageUrl=url;else if(kind==='option'&&s.qs[i]){s.qs[i].optionImages=s.qs[i].optionImages||[];s.qs[i].optionImages[j]=url}else if((kind==='matchingLeft'||kind==='matchingRight')&&s.qs[i]&&s.qs[i].pairs&&s.qs[i].pairs[j])s.qs[i].pairs[j][kind==='matchingLeft'?'leftImageUrl':'rightImageUrl']=url;else if(kind==='statement'&&s.qs[i]){s.qs[i].subquestionImages=s.qs[i].subquestionImages||[];s.qs[i].subquestionImages[j]=url}}
async function removeDriveImage(url){const fileId=imageFileId(url);if(!fileId)return;try{await api('deleteAssessmentImage',{fileId:fileId})}catch(e){console.warn('File lama belum dapat dipindahkan ke sampah Drive:',e.message)}}
async function removeAssessmentImage(kind,i,j){const url=imageUrlFor(kind,i,j);if(!url)return;if(!confirm('Hapus gambar ini dari editor? File Drive akan dipindahkan ke sampah setelah bundel/asesmen berhasil disimpan.'))return;s.pendingImageDeletes=s.pendingImageDeletes||[];s.pendingImageDeletes.push(url);setImageUrl(kind,i,j,'');render();toast('Gambar ditandai untuk dihapus setelah penyimpanan.')} 
async function processPendingImageDeletes(){const list=[...new Set(s.pendingImageDeletes||[])];s.pendingImageDeletes=[];for(const url of list){const id=imageFileId(url);if(!id)continue;try{const r=await api('deleteAssessmentImage',{fileId:id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Gagal menghapus');}catch(e){console.warn('File gambar lama tidak terhapus otomatis:',e.message);toast('Perubahan tersimpan, tetapi satu gambar lama belum bisa dibuang dari Drive.')}}}
async function uploadImageBlob(file,name,kind,i,j){
 if(file.size>4*1024*1024){toast('Ukuran gambar maksimal 4 MB.');return}
 if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){toast('Gunakan gambar JPG, PNG, WebP, atau GIF.');return}
 if(s.uploadingImage){toast('Tunggu hingga unggahan sebelumnya selesai.');return}
 const previousUrl=imageUrlFor(kind,i,j);
 s.uploadingImage=true;s.uploadingLabel='Mengunggah gambar '+(kind==='passage'?'bacaan':kind==='question'?'soal':kind==='questionPassage'?'bacaan soal':kind==='matchingLeft'?'kolom kiri':kind==='matchingRight'?'kolom kanan':'opsi jawaban')+'...';render();
 try{
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Gagal membaca gambar'));reader.readAsDataURL(file)});
  const base64=String(dataUrl).split(',')[1]||'';
  const uploadKind=kind==='libraryPassage'?'passage':kind;
  const result=await api('uploadAssessmentImage',{fileName:name,mimeType:file.type,base64,kind:uploadKind,assessmentId:s.editingId||((s.currentAssessment||{}).assessment||{}).assessmentId||''});
  if(!result||!result.ok)throw Error(result&&result.error?result.error:'Upload gambar gagal');
  const url=result.data.imageUrl||result.data.url;
  setImageUrl(kind,i,j,url);
  if(previousUrl&&previousUrl!==url){s.pendingImageDeletes=s.pendingImageDeletes||[];s.pendingImageDeletes.push(previousUrl);}
  toast(result.data.warning?'Gambar tersimpan. '+result.data.warning:'Gambar berhasil diunggah ke Drive.');
 }catch(e){toast('Gagal mengunggah gambar: '+e.message)}
 finally{s.uploadingImage=false;s.uploadingLabel='';render()}
}

function render(){let p=s.page,c=p==='overview'?overview():p==='bundles'?bundlesPage():p==='assessments'?assessments():p==='detail'?detailPage():p==='students'?students():p==='reports'?reports():p==='progress'?progress():settings();document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="brand"><span class="logo">R</span><span>Rumble Assessment<br><small>Learning, measured.</small></span></div><nav class="nav">'+nav()+'</nav><footer>Platform asesmen digital<br>Versi awal · Preview</footer></aside><main class="main"><header class="top"><span class="muted">Workspace / '+p+'</span><span>'+s.role+' <select onchange="role(this.value)"><option value="teacher" '+(s.role==='teacher'?'selected':'')+'>Guru</option><option value="student" '+(s.role==='student'?'selected':'')+'>Siswa</option></select></span></header><div class="content">'+c+'</div></main></div>';document.querySelectorAll('.question p,.math-content,.passage-content').forEach(el=>renderMath(el));document.querySelectorAll('.math-preview').forEach(el=>{if(!el.textContent.trim()&&el.previousElementSibling)el.textContent=el.previousElementSibling.value||'';renderMath(el)});document.querySelectorAll('.question textarea').forEach((el,i)=>el.setAttribute('data-question-index',i));}
render();
loadAssessments();
</script></body></html>
