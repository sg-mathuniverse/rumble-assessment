<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rumble Assessment</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;800&display=swap" rel="stylesheet"><style>
:root{--navy:#142d4e;--blue:#285da8;--paper:#f5f7fb;--ink:#17243a;--muted:#718096;--line:#e1e8f0;--green:#1b8764}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px 'DM Sans',sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:24px 15px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;gap:10px;align-items:center;font:800 17px Manrope}.logo{background:#f3c76a;color:var(--navy);border-radius:11px;padding:9px 13px}.side small{color:#b7c9e0}.nav{display:grid;gap:6px}.nav button{border:0;border-radius:9px;text-align:left;padding:12px;background:transparent;color:#d2deed}.nav button.active,.nav button:hover{background:#ffffff20;color:white}.side footer{margin-top:auto;color:#b7c9e0;font-size:12px;line-height:1.7}.main{min-width:0}.top{height:70px;background:white;border-bottom:1px solid var(--line);padding:0 30px;display:flex;align-items:center;justify-content:space-between}.top select{padding:8px;border:1px solid var(--line);border-radius:8px}.content{padding:30px;max-width:1250px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;margin-bottom:24px}.kicker{color:var(--blue);font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase}.head h2{font:800 27px Manrope;margin:7px 0}.head p,.muted{color:var(--muted)}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:white;font-weight:700;color:var(--ink)}.primary{background:var(--blue);color:white;border-color:var(--blue)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.columns{grid-template-columns:1.4fr 1fr}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;min-width:0}.card h3{font:800 15px Manrope;margin:0 0 17px}.statlabel{color:var(--muted);font-size:12px}.num{font:800 28px Manrope;margin:12px 0 5px}.listitem{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.symbol{background:#eaf2ff;color:var(--blue);padding:12px;border-radius:10px;font-weight:800}.grow{flex:1;min-width:0}.grow b{display:block;margin-bottom:5px}.grow small{color:var(--muted)}.pill{font-size:10px;font-weight:700;border-radius:30px;padding:5px 8px;background:#edf2f7}.pill.live{background:#e3f7ef;color:var(--green)}.bar{height:7px;border-radius:8px;background:#edf1f6;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--blue)}.notice{padding:13px;background:#edf5ff;border-radius:10px;color:#34567e;font-size:12px;line-height:1.6}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d6dfeb;border-radius:8px;background:white}.field textarea{min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.question{border:1px solid var(--line);border-radius:11px;padding:15px;margin:13px 0;background:#fafcff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted)}.hidden{display:none}.toast{display:none;position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:13px 18px;border-radius:10px;max-width:360px}.footnote{font-size:11px;line-height:1.6;color:var(--muted);margin-top:20px}@media(max-width:900px){.layout{grid-template-columns:185px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.content{padding:20px}}@media(max-width:620px){.layout{display:block}.side{padding:12px;gap:10px}.side footer{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.top{height:56px;padding:0 14px}.content{padding:16px 12px}.head{display:block}.head .btn{margin-top:12px}.head h2{font-size:23px}.card{padding:14px}.formgrid{grid-template-columns:1fr}.pill{display:none}}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script></head><body><div id="app"></div><div class="toast" id="toast"></div><script>
const s={role:'teacher',page:'overview',items:[],loadedFromServer:false,qs:[],currentAssessment:null,answers:{}};
const demo=[{id:'ASM-101',title:'Persamaan Kuadrat',subject:'Matematika',className:'Kelas IX-A',duration:60,status:'Aktif'},{id:'ASM-102',title:'Sistem Persamaan Linear',subject:'Matematika',className:'Kelas VIII-B',duration:45,status:'Draft'},{id:'ASM-103',title:'Fungsi dan Grafik',subject:'Matematika',className:'Kelas IX-B',duration:50,status:'Selesai'}];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',3200)}
function go(p){s.page=p;render()}function role(r){s.role=r;s.page=r==='teacher'?'overview':'progress';s.currentAssessment=null;render();loadAssessments()}
function head(k,t,d,b=''){return '<div class="head"><div><div class="kicker">'+k+'</div><h2>'+t+'</h2><p>'+d+'</p></div>'+b+'</div>'}
function stat(l,n,d){return '<div class="card"><div class="statlabel">'+l+'</div><div class="num">'+n+'</div><div class="muted">'+d+'</div></div>'}
function nav(){let a=s.role==='teacher'?[['overview','▦ Ringkasan'],['assessments','▤ Asesmen'],['students','♙ Siswa'],['reports','▥ Analitik'],['settings','⚙ Pengaturan']]:[['progress','↗ Progres saya'],['assessments','▤ Asesmen'],['settings','⚙ Pengaturan']];return a.map(([k,v])=>'<button class="'+(s.page===k?'active':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('')}
function rows(){
 const source=s.loadedFromServer?s.items:(s.items.length?s.items:demo);
 if(!source.length)return '<p class="muted">Belum ada asesmen tersimpan di backend.</p>';
 return source.map(a=>{
  const id=esc(a.assessmentId||a.id||'');
  const status=String(a.status||'draft');
  return '<div class="listitem"><div class="symbol">∑</div><div class="grow"><b>'+esc(a.title)+'</b><small>'+esc(a.subject||'Umum')+' · '+esc(a.className||'Kelas')+' · '+(a.duration||45)+' menit · '+(a.questionCount||0)+' soal</small></div><span class="pill '+((status==='Aktif'||status==='published')?'live':'')+'">'+esc(status)+'</span><button class="btn" onclick="openAssessment(\''+id+'\')">'+(s.role==='student'?'Buka':'Detail')+'</button></div>';
 }).join('');
}
function overview(){return head('Dashboard guru','Selamat datang kembali','Pantau asesmen, aktivitas kelas, dan hasil belajar siswa.','<button class="btn primary" onclick="newA()">＋ Buat asesmen</button>')+'<div class="grid stats">'+stat('Total asesmen','12','3 aktif semester ini')+stat('Siswa terdaftar','186','Di 6 kelas belajar')+stat('Rata-rata nilai','81,4','Data contoh')+stat('Perlu diperiksa','8','Jawaban esai menunggu')+'</div><div class="grid columns"><div class="card"><h3>Asesmen terbaru</h3>'+rows()+'</div><div class="card"><h3>Ringkasan kelas</h3>'+[['IX-A',86],['VIII-B',79],['IX-B',74],['VII-A',91]].map(a=>'<p>'+a[0]+' <span style="float:right">'+a[1]+'/100</span></p><div class="bar"><i style="width:'+a[1]+'%"></i></div>').join('')+'<div class="notice">Analisis butir dapat membantu mengenali soal yang terlalu mudah atau sulit.</div></div></div>'}
function assessments(){return head('Bank asesmen','Kelola asesmen','Buat ujian, atur waktu, dan tinjau status publikasi.','<button class="btn primary" onclick="newA()">＋ Buat asesmen</button>')+'<div class="card"><h3>Semua asesmen</h3>'+rows()+'</div>'+(s.qs.length?editor():'')+'<p class="footnote">Data contoh ditampilkan sebelum backend dihubungkan. Draft lokal belum tersimpan di server.</p>'}
function students(){return head('Manajemen kelas','Daftar siswa','Ringkasan siswa dan status pengerjaan.')+'<div class="card"><h3>Siswa terdaftar (contoh)</h3><table class="table"><tr><th>Nama</th><th>Kelas</th><th>Selesai</th><th>Rata-rata</th></tr><tr><td>Alya Putri</td><td>IX-A</td><td>8/9</td><td>91</td></tr><tr><td>Bima Pratama</td><td>IX-A</td><td>7/9</td><td>84</td></tr><tr><td>Citra Lestari</td><td>VIII-B</td><td>9/9</td><td>88</td></tr></table></div>'}
function reports(){return head('Analitik','Laporan & analisis butir','Distribusi nilai dan identifikasi butir yang perlu ditinjau.')+'<div class="grid stats">'+stat('Sudah dinilai','164','Contoh')+stat('Menunggu nilai','8','Esai')+stat('Nilai tertinggi','100','Contoh')+stat('Nilai terendah','42','Contoh')+'</div><div class="card"><h3>Contoh analisis butir</h3><table class="table"><tr><th>Butir</th><th>Jawaban benar</th><th>Interpretasi</th></tr><tr><td>Soal 1</td><td>92%</td><td>Mudah</td></tr><tr><td>Soal 2</td><td>68%</td><td>Sedang</td></tr><tr><td>Soal 3</td><td>31%</td><td>Sulit</td></tr></table><p class="footnote">Analisis nyata akan dihitung dari jawaban siswa setelah backend aktif.</p></div>'}
function progress(){return head('Area siswa','Progres belajar saya','Pantau hasil asesmen dan perkembangan.')+'<div class="grid stats">'+stat('Asesmen selesai','8','Dari 10 tersedia')+stat('Rata-rata nilai','84','Contoh')+stat('Peringkat kelas','5/31','Contoh')+stat('Target belajar','80/100','Tercapai pada contoh')+'</div><div class="card"><h3>Riwayat asesmen</h3>'+[['Persamaan Kuadrat','92'],['Fungsi dan Grafik','81'],['Geometri Dasar','86'],['Statistika','77']].map(a=>'<div class="listitem"><div class="grow"><b>'+a[0]+'</b><small>Hasil asesmen contoh</small></div><strong>'+a[1]+'</strong></div>').join('')+'</div>'}
function settings(){return head('Konfigurasi','Koneksi aplikasi','Rumble Assessment menggunakan Apps Script HTML Service.')+'<div class="card"><h3>Status backend</h3><p class="muted">Halaman ini berjalan melalui Apps Script. Koneksi menggunakan google.script.run sehingga tidak memerlukan URL API di browser.</p><div class="actions"><button class="btn primary" onclick="testApi()">Uji koneksi</button></div><div class="notice">Akses aplikasi tetap dibatasi oleh pengaturan deployment Apps Script. Sebelum menggunakan data siswa asli, pastikan izin setiap peran telah diterapkan di sisi server.</div></div>'}
function newA(){s.page='assessments';s.editingId=null;s.meta={title:'',subject:'Matematika',className:'',duration:60,startAt:'',endAt:'',passageText:'',passageImageUrl:''};s.qs=[{type:'multiple_choice',text:'',points:1,options:['','','','',''],optionImages:[],answer:'0',imageUrl:'',subquestions:[],rubricLevels:[]}];render();setTimeout(()=>document.getElementById('editor')?.scrollIntoView({behavior:'smooth'}),0)}
function editor(){
 s.qs.forEach(q=>{if(q.type==='multiple_choice'||q.type==='multi_select'){q.options=Array.from({length:5},(_,j)=>q.options?.[j]||'');q.optionImages=Array.from({length:5},(_,j)=>q.optionImages?.[j]||'');}if(!Array.isArray(q.subquestions))q.subquestions=[];if(!Array.isArray(q.rubricLevels))q.rubricLevels=[];});
 const m=s.meta||{};
 return '<div id="editor" class="card" style="margin-top:16px"><h3>'+(s.editingId?'Edit asesmen':'Buat asesmen baru')+'</h3><div class="formgrid"><div class="field"><label>Judul *</label><input id="title" placeholder="Persamaan Kuadrat" value="'+esc(m.title||'')+'"></div><div class="field"><label>Mata pelajaran</label><input id="subject" value="'+esc(m.subject||'Matematika')+'"></div><div class="field"><label>Kelas</label><input id="className" placeholder="IX-A" value="'+esc(m.className||'')+'"></div><div class="field"><label>Durasi (menit)</label><input id="duration" type="number" value="'+esc(m.duration||60)+'" min="1" max="300"></div><div class="field"><label>Mulai (opsional)</label><input id="startAt" type="datetime-local" value="'+esc(m.startAt||'')+'"></div><div class="field"><label>Berakhir (opsional)</label><input id="endAt" type="datetime-local" value="'+esc(m.endAt||'')+'"></div></div><div class="field"><label>Bacaan / stimulus bersama (opsional)</label><textarea rows="5" oninput="s.meta.passageText=this.value;previewMath(this)" onpaste="handleEquationPaste(event,this,&quot;passage&quot;)">'+esc(m.passageText||'')+'</textarea><div class="math-preview" style="padding:8px 0"></div><small class="muted">Bacaan ini akan ditampilkan satu kali di atas seluruh soal asesmen, sehingga bisa dipakai untuk 2–3 soal atau lebih.</small><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Gambar bacaan" onchange="uploadPassageImage(event)">'+(m.passageImageUrl?'<img src="'+esc(m.passageImageUrl)+'" alt="Gambar bacaan" style="display:block;max-width:300px;max-height:200px;margin-top:8px;border-radius:8px">':'')+'</div>'+s.qs.map((q,i)=>'<div class="question"><b>Soal '+(i+1)+'</b><div class="field"><label>Tipe soal</label><select onchange="changeType('+i+',this.value)">'+[['multiple_choice','Pilihan ganda'],['true_false','Benar/salah'],['multi_select','Pilihan jamak'],['matching','Menjodohkan'],['essay','Uraian / esai']].map(o=>'<option value="'+o[0]+'" '+(q.type===o[0]?'selected':'')+'>'+o[1]+'</option>').join('')+'</select></div><div class="field"><label>Pertanyaan (LaTeX: $x^2+2x=0$; persamaan Word dapat ditempel)</label><textarea oninput="s.qs['+i+'].text=this.value;previewMath(this)" onpaste="handleEquationPaste(event,this,&quot;question&quot;,'+i+')">'+esc(q.text)+'</textarea><div class="math-preview" style="padding:8px 0;min-height:20px"></div><div class="field"><label>Gambar pada soal (opsional)</label><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="uploadQuestionImage(event,'+i+')">'+(q.imageUrl?'<img src="'+esc(q.imageUrl)+'" alt="Gambar soal" style="display:block;max-width:260px;max-height:180px;margin-top:8px;border-radius:8px">':'')+'</div><div class="field"><label>Bobot nilai</label><input type="number" min="0" max="1000" value="'+esc(q.points??1)+'" oninput="s.qs['+i+'].points=Number(this.value)"></div>'+(q.type==='multiple_choice'||q.type==='multi_select'?Array.from({length:5},(_,j)=>q.options[j]||'').map((v,j)=>'<div class="field"><label>Opsi '+String.fromCharCode(65+j)+'</label><input value="'+esc(v)+'" oninput="s.qs['+i+'].options['+j+']=this.value;previewMath(this)" onpaste="handleEquationPaste(event,this,&quot;option&quot;,'+i+','+j+')"><div class="math-preview" style="padding:6px 0;min-height:12px"></div><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Gambar opsi '+String.fromCharCode(65+j)+'" onchange="uploadOptionImage(event,'+i+','+j+')">'+(q.optionImages[j]?'<img src="'+esc(q.optionImages[j])+'" alt="Gambar opsi" style="display:block;max-width:220px;max-height:140px;margin-top:6px;border-radius:8px">':'')+'<label><input type="'+(q.type==='multi_select'?'checkbox':'radio')+'" name="ans'+i+'" '+((Array.isArray(q.answer)?q.answer.includes(String(j)):q.answer===String(j))?'checked':'')+' onchange="answer('+i+','+j+',this.checked,'+"'"+q.type+"'"+')"> Kunci jawaban</label></div>').join(''):q.type==='true_false'?'<div class="field"><label>Kunci</label><select onchange="s.qs['+i+'].answer=this.value"><option value="true" '+(String(q.answer)!=='false'?'selected':'')+'>Benar</option><option value="false" '+(String(q.answer)==='false'?'selected':'')+'>Salah</option></select></div>':q.type==='essay'?'<div class="field"><label>Subpertanyaan (satu per baris, misalnya a), b), c))</label><textarea rows="3" oninput="s.qs['+i+'].subquestions=this.value.split(String.fromCharCode(10)).filter(x=>x.trim())">'+esc((q.subquestions||[]).join('\n'))+'</textarea><label>Kriteria/rubrik skor (satu baris per skor, dari 0 sampai bobot maksimum)</label><textarea rows="5" oninput="s.qs['+i+'].rubricLevels=this.value.split(String.fromCharCode(10))">'+esc((q.rubricLevels||[]).join('\n')||(q.rubric||''))+'</textarea><small class="muted">Contoh: 0 = tidak menjawab; 1 = jawaban tidak relevan; 2 = menjawab benar satu subpertanyaan; 3 = dua subpertanyaan; 4 = seluruh bagian benar. Guru tetap menentukan skor akhir.</small></div>':'<div class="field"><label>Pasangan</label><textarea placeholder="Kiri 1 = Kanan A; Kiri 2 = Kanan B" oninput="s.qs['+i+'].pairs=this.value">'+esc(q.pairs||'')+'</textarea></div>')+'</div>').join('')+'<div class="actions"><button class="btn" onclick="addQ()">＋ Tambah soal</button><button class="btn primary" onclick="saveA()">'+(s.editingId?'Simpan perubahan':'Simpan draft')+'</button><button class="btn" onclick="s.qs=[];s.editingId=null;s.meta={};render()">Tutup</button></div><p class="footnote">Persamaan dan gambar dapat dimasukkan pada pertanyaan maupun pilihan jawaban. Gambar diunggah ke folder Drive aplikasi.</p></div>';
}
function addQ(){s.qs.push({type:'multiple_choice',text:'',points:1,options:['','','','',''],optionImages:[],answer:'0',imageUrl:'',subquestions:[],rubricLevels:[]});render()}
function changeType(i,t){const old=s.qs[i];s.qs[i]={...old,type:t,options:Array.from({length:5},(_,j)=>old.options?.[j]||''),optionImages:Array.from({length:5},(_,j)=>old.optionImages?.[j]||''),answer:t==='multi_select'?[]:t==='true_false'?'true':String(old.answer||'0'),subquestions:old.subquestions||[],rubricLevels:old.rubricLevels||[]};render()}
function answer(i,j,c,t){if(t==='multi_select'){let a=Array.isArray(s.qs[i].answer)?s.qs[i].answer:[];s.qs[i].answer=c?[...new Set([...a,String(j)])]:a.filter(x=>x!==String(j))}else s.qs[i].answer=String(j)}
function api(action,payload={}){
 return new Promise((resolve,reject)=>{
  if(!window.google||!google.script||!google.script.run){reject(new Error('google.script.run tidak tersedia. Buka aplikasi melalui URL deployment Apps Script.'));return}
  google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err&&err.message?err.message:String(err)))).clientApi(action,payload);
 });
}

function detailPage(){
 const d=s.currentAssessment;
 if(!d)return '<div class="card"><p>Memuat detail asesmen...</p></div>';
 const a=d.assessment||{},qs=d.questions||[],student=s.role==='student';
 const back='<button class="btn" onclick="go(\'assessments\')">← Kembali</button>';
 let body='';
 const passage=(a.passageText||a.passageImageUrl)?'<div class="question" style="white-space:pre-wrap"><b>Bacaan / stimulus</b><div class="passage-content">'+esc(a.passageText||'')+'</div>'+(a.passageImageUrl?'<img src="'+esc(a.passageImageUrl)+'" alt="Gambar bacaan" style="display:block;max-width:600px;max-height:380px;margin:8px 0;border-radius:8px">':'')+'</div>':'';
 if(student){
  body='<h3>Kerjakan asesmen</h3><div class="field"><label>ID siswa (uji coba)</label><input id="studentId" placeholder="Contoh: SISWA-001"></div>'+passage;
  body+=qs.map((q,i)=>{
   const id=esc(q.id||'');let control='';
   if(q.type==='multiple_choice'||q.type==='multi_select'){
    control=(Array.isArray(q.options)?q.options:[]).map((o,j)=>'<label style="display:block;padding:7px 0"><input type="'+(q.type==='multi_select'?'checkbox':'radio')+'" name="answer_'+id+'" value="'+j+'" onchange="setAnswer(\''+id+'\','+j+',this.checked,'+(q.type==='multi_select'?'true':'false')+')"> '+String.fromCharCode(65+j)+'. <span class="math-content">'+esc(o)+'</span>'+(q.optionImages&&q.optionImages[j]?'<img src="'+esc(q.optionImages[j])+'" alt="Gambar pilihan" style="display:block;max-width:200px;max-height:130px;margin:5px 0">':'')+'</label>').join('');
   }else if(q.type==='true_false'){
    control='<label><input type="radio" name="answer_'+id+'" onchange="setAnswer(\''+id+'\',\'true\',true,false)"> Benar</label> &nbsp; <label><input type="radio" name="answer_'+id+'" onchange="setAnswer(\''+id+'\',\'false\',true,false)"> Salah</label>';
   }else if(q.type==='essay'&&Array.isArray(q.subquestions)&&q.subquestions.length){
    control=q.subquestions.map((sub,j)=>'<div class="field"><label>'+esc(sub)+'</label><textarea placeholder="Jawaban '+esc(sub)+'" oninput="setSubAnswer(\''+id+'\','+j+',this.value)"></textarea></div>').join('');
   }else{
    control='<textarea placeholder="Tulis jawaban di sini" oninput="setAnswer(\''+id+'\',this.value,true,false)"></textarea>';
   }
   return '<div class="question"><b>Soal '+(i+1)+' · '+esc(q.points)+' poin</b><p>'+esc(q.text||'(Soal belum diisi)')+'</p>'+(q.imageUrl?'<img src="'+esc(q.imageUrl)+'" alt="Gambar soal" style="display:block;max-width:500px;max-height:320px;margin:8px 0;border-radius:8px">':'')+control+'</div>';
  }).join('');
  body+='<div class="actions"><button class="btn primary" onclick="submitAssessment()">Kirim jawaban</button></div><p class="footnote">Mode uji coba. Jangan gunakan data siswa sungguhan sebelum autentikasi dan pemeriksaan izin server disiapkan.</p>';
 }else{
  body='<h3>Daftar soal</h3>'+passage+qs.map((q,i)=>'<div class="question"><b>Soal '+(i+1)+' · '+esc(q.type)+' · '+esc(q.points)+' poin</b><p>'+esc(q.text||'(Soal belum diisi)')+'</p>'+(q.imageUrl?'<img src="'+esc(q.imageUrl)+'" alt="Gambar soal" style="display:block;max-width:500px;max-height:320px;margin:8px 0;border-radius:8px">':'')+(Array.isArray(q.options)?'<ol type="A">'+q.options.map((o,j)=>'<li><span class="math-content">'+esc(o)+'</span>'+(q.optionImages&&q.optionImages[j]?'<img src="'+esc(q.optionImages[j])+'" alt="Gambar pilihan" style="display:block;max-width:200px;max-height:130px;margin:5px 0">':'')+'</li>').join('')+'</ol>':'')+(q.type==='essay'&&q.subquestions&&q.subquestions.length?'<p><b>Subpertanyaan:</b></p><ul>'+q.subquestions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p><b>Rubrik:</b></p><ol>'+((q.rubricLevels&&q.rubricLevels.length)?q.rubricLevels:[q.rubric||'Rubrik belum diisi']).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'')+'</div>').join('');
  if(a.status!=='published'){
   body+='<div class="actions"><button class="btn" onclick="editAssessment(\''+esc(a.assessmentId||a.id||'')+'\')">Edit asesmen</button><button class="btn primary" onclick="publishAssessment(\''+esc(a.assessmentId||a.id||'')+'\')">Publikasikan asesmen</button></div>';
  }else body+='<p class="notice">Asesmen sudah dipublikasikan. Untuk menjaga hasil siswa, edit langsung dinonaktifkan.</p>';
 }
 return head(student?'Area siswa':'Detail asesmen',esc(a.title||'Asesmen'),esc(a.subject||'')+' · '+esc(a.className||'')+' · '+(a.duration||45)+' menit',back)+'<div class="card"><div class="actions"><span class="pill '+(a.status==='published'?'live':'')+'">Status: '+esc(a.status||'draft')+'</span><span class="pill">'+qs.length+' soal</span></div>'+body+'</div>';
}
function setAnswer(id,value,checked,multi){
 if(multi){const a=Array.isArray(s.answers[id])?s.answers[id]:[];s.answers[id]=checked?[...new Set([...a,String(value)])]:a.filter(x=>x!==String(value))}
 else s.answers[id]=value;
}
async function openAssessment(id){
 try{const r=await api('getAssessment',{id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Detail tidak tersedia');s.currentAssessment=r.data;s.answers={};s.page='detail';render()}
 catch(e){toast('Gagal membuka detail: '+e.message)}
}

async function publishAssessment(id){
 if(!confirm('Publikasikan asesmen ini agar dapat dikerjakan pada mode siswa?'))return;
 try{const r=await api('publishAssessment',{id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Gagal mempublikasikan');toast('Asesmen berhasil dipublikasikan.');s.currentAssessment=null;s.page='assessments';await loadAssessments()}
 catch(e){toast('Gagal mempublikasikan: '+e.message)}
}
async function submitAssessment(){
 const studentId=(document.getElementById('studentId')||{}).value||'';
 if(!studentId.trim()){toast('Isi ID siswa untuk uji coba.');return}
 const a=(s.currentAssessment||{}).assessment||{};
 try{const r=await api('submitAttempt',{assessmentId:a.assessmentId||a.id,studentId:studentId.trim(),answers:s.answers,startedAt:new Date().toISOString()});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Jawaban gagal dikirim');toast('Jawaban terkirim. Nilai: '+r.data.score+'/'+r.data.maxScore);s.page='assessments';s.currentAssessment=null;render()}
 catch(e){toast('Gagal mengirim jawaban: '+e.message)}
}

async function testApi(){
 try{const r=await api('health');if(!r||!r.ok)throw Error(r&&r.error?r.error:'Respons backend tidak valid');toast('Koneksi Apps Script berhasil.')}
 catch(e){toast('Koneksi gagal: '+e.message)}
}
async function saveA(){
 const title=document.getElementById('title').value.trim();
 if(!title||!s.qs.length){toast('Isi judul dan minimal satu soal.');return}
 const payload={id:s.editingId||undefined,title,subject:document.getElementById('subject').value,className:document.getElementById('className').value,duration:Number(document.getElementById('duration').value)||60,startAt:document.getElementById('startAt').value,endAt:document.getElementById('endAt').value,passageText:(s.meta||{}).passageText||'',passageImageUrl:(s.meta||{}).passageImageUrl||'',questions:s.qs,status:'draft'};
 try{
  const r=await api(s.editingId?'updateAssessment':'createAssessment',payload);
  if(!r||!r.ok)throw Error(r&&r.error?r.error:'Respons backend tidak valid');
  toast(s.editingId?'Perubahan asesmen tersimpan.':'Draft tersimpan di backend.');
  s.editingId=null;s.qs=[];s.meta={};s.currentAssessment=null;s.page='assessments';await loadAssessments();
 }catch(e){toast('Gagal menyimpan: '+e.message)}
}
async function editAssessment(id){
 try{
  const r=await api('getAssessment',{id,includeAnswers:true});
  if(!r||!r.ok)throw Error(r&&r.error?r.error:'Asesmen tidak tersedia');
  const d=r.data,a=d.assessment||{};
  if(a.status==='published')throw Error('Asesmen yang sudah dipublikasikan tidak dapat diedit.');
  s.editingId=id;s.meta={title:a.title||'',subject:a.subject||'Matematika',className:a.className||'',duration:a.duration||60,startAt:a.startAt||'',endAt:a.endAt||'',passageText:a.passageText||'',passageImageUrl:a.passageImageUrl||''};
  s.qs=(d.questions||[]).map(q=>({...q,answer:q.answer===undefined?'0':q.answer,options:q.options||[],optionImages:q.optionImages||[],subquestions:q.subquestions||[],rubricLevels:q.rubricLevels||[]}));
  s.currentAssessment=null;s.page='assessments';render();setTimeout(()=>document.getElementById('editor')?.scrollIntoView({behavior:'smooth'}),0);
 }catch(e){toast('Tidak dapat mengedit: '+e.message)}
}

async function loadAssessments(){
 try{
  const r=await api('listAssessments',s.role==='student'?{status:'published'}:{});
  if(!r||!r.ok)throw Error(r&&r.error?r.error:'Respons backend tidak valid');
  s.items=Array.isArray(r.data)?r.data.map(a=>Object.assign({},a,{id:a.assessmentId||a.id})):[];s.loadedFromServer=true;render();
 }catch(e){console.warn('Rumble API:',e);toast('Belum dapat memuat asesmen dari server: '+e.message)}
}
function previewMath(el){const box=el.nextElementSibling;if(!box||!box.classList.contains('math-preview'))return;box.textContent=el.value;renderMath(box)}
function renderMath(root){if(typeof renderMathInElement!=='function')return;try{renderMathInElement(root,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});}catch(e){}}
function setSubAnswer(id,index,value){const current=s.answers[id]&&typeof s.answers[id]==='object'?s.answers[id]:{};current[String(index)]=value;s.answers[id]=current}
function handleEquationPaste(event,el,kind,i,j){
 const cd=event.clipboardData;if(!cd)return;
 const items=Array.from(cd.items||[]);const imageItem=items.find(item=>item.kind==='file'&&/^image\\//.test(item.type));
 if(imageItem){
  if(kind==='passage'){event.preventDefault();const file=imageItem.getAsFile();if(file)uploadImageBlob(file,file.name||'gambar-bacaan.png','passage');return;}
  event.preventDefault();const file=imageItem.getAsFile();if(file)uploadImageBlob(file,file.name||'gambar-soal.png',kind,i,j);return;
 }
 let text=cd.getData('text/plain');
 if(!text){const html=cd.getData('text/html');if(html){const tmp=document.createElement('div');tmp.innerHTML=html;text=tmp.textContent||tmp.innerText||'';}}
 if(!text)return;
 const hasMath=/[=^_]|[√∫≤≥×÷±]/.test(text)||text.includes('\\');
 if(hasMath&&!text.includes('$')&&!text.includes('\\(')&&!text.includes('\\[')){
  event.preventDefault();const start=el.selectionStart||0,end=el.selectionEnd||start;const value='\\('+text+'\\)';
  if(typeof el.setRangeText==='function')el.setRangeText(value,start,end,'end');else el.value=el.value.slice(0,start)+value+el.value.slice(end);
  if(kind==='question'&&s.qs[i])s.qs[i].text=el.value;
  else if(kind==='option'&&s.qs[i])s.qs[i].options[j]=el.value;
  else if(kind==='passage'&&s.meta)s.meta.passageText=el.value;
  previewMath(el);
 }
}
function uploadQuestionImage(event,i){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'question',i)}
function uploadOptionImage(event,i,j){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'option',i,j)}
function uploadPassageImage(event){const file=event.target.files&&event.target.files[0];if(file)uploadImageBlob(file,file.name,'passage')}
async function uploadImageBlob(file,name,kind,i,j){
 if(file.size>4*1024*1024){toast('Ukuran gambar maksimal 4 MB.');return}
 if(!/^image\\/(jpeg|png|webp|gif)$/.test(file.type)){toast('Gunakan gambar JPG, PNG, WebP, atau GIF.');return}
 try{
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Gagal membaca gambar'));reader.readAsDataURL(file)});
  const base64=String(dataUrl).split(',')[1]||'';
  const result=await api('uploadAssessmentImage',{fileName:name,mimeType:file.type,base64});
  if(!result||!result.ok)throw Error(result&&result.error?result.error:'Upload gambar gagal');
  const url=result.data.imageUrl||result.data.url;
  if(kind==='question'&&s.qs[i])s.qs[i].imageUrl=url;
  else if(kind==='option'&&s.qs[i]){s.qs[i].optionImages=s.qs[i].optionImages||[];s.qs[i].optionImages[j]=url;}
  else if(kind==='passage'&&s.meta)s.meta.passageImageUrl=url;
  render();toast('Gambar berhasil diunggah ke Drive.');
 }catch(e){toast('Gagal mengunggah gambar: '+e.message)}
}
function render(){let p=s.page,c=p==='overview'?overview():p==='assessments'?assessments():p==='detail'?detailPage():p==='students'?students():p==='reports'?reports():p==='progress'?progress():settings();document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="brand"><span class="logo">R</span><span>Rumble Assessment<br><small>Learning, measured.</small></span></div><nav class="nav">'+nav()+'</nav><footer>Platform asesmen digital<br>Versi awal · Preview</footer></aside><main class="main"><header class="top"><span class="muted">Workspace / '+p+'</span><span>'+s.role+' <select onchange="role(this.value)"><option value="teacher" '+(s.role==='teacher'?'selected':'')+'>Guru</option><option value="student" '+(s.role==='student'?'selected':'')+'>Siswa</option></select></span></header><div class="content">'+c+'</div></main></div>';document.querySelectorAll('.question p,.math-content,.passage-content').forEach(el=>renderMath(el));document.querySelectorAll('.math-preview').forEach(el=>{if(!el.textContent.trim()&&el.previousElementSibling)el.textContent=el.previousElementSibling.value||'';renderMath(el)});document.querySelectorAll('.question textarea').forEach((el,i)=>el.setAttribute('data-question-index',i));}
render();
loadAssessments();
</script></body></html>
