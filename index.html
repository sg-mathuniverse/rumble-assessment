<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rumble Assessment</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;800&display=swap" rel="stylesheet"><style>
:root{--navy:#142d4e;--blue:#285da8;--paper:#f5f7fb;--ink:#17243a;--muted:#718096;--line:#e1e8f0;--green:#1b8764}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px 'DM Sans',sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:24px 15px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;gap:10px;align-items:center;font:800 17px Manrope}.logo{background:#f3c76a;color:var(--navy);border-radius:11px;padding:9px 13px}.side small{color:#b7c9e0}.nav{display:grid;gap:6px}.nav button{border:0;border-radius:9px;text-align:left;padding:12px;background:transparent;color:#d2deed}.nav button.active,.nav button:hover{background:#ffffff20;color:white}.side footer{margin-top:auto;color:#b7c9e0;font-size:12px;line-height:1.7}.main{min-width:0}.top{height:70px;background:white;border-bottom:1px solid var(--line);padding:0 30px;display:flex;align-items:center;justify-content:space-between}.top select{padding:8px;border:1px solid var(--line);border-radius:8px}.content{padding:30px;max-width:1250px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;margin-bottom:24px}.kicker{color:var(--blue);font-size:11px;letter-spacing:.13em;font-weight:700;text-transform:uppercase}.head h2{font:800 27px Manrope;margin:7px 0}.head p,.muted{color:var(--muted)}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:white;font-weight:700;color:var(--ink)}.primary{background:var(--blue);color:white;border-color:var(--blue)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.columns{grid-template-columns:1.4fr 1fr}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;min-width:0}.card h3{font:800 15px Manrope;margin:0 0 17px}.statlabel{color:var(--muted);font-size:12px}.num{font:800 28px Manrope;margin:12px 0 5px}.listitem{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.symbol{background:#eaf2ff;color:var(--blue);padding:12px;border-radius:10px;font-weight:800}.grow{flex:1;min-width:0}.grow b{display:block;margin-bottom:5px}.grow small{color:var(--muted)}.pill{font-size:10px;font-weight:700;border-radius:30px;padding:5px 8px;background:#edf2f7}.pill.live{background:#e3f7ef;color:var(--green)}.bar{height:7px;border-radius:8px;background:#edf1f6;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--blue)}.notice{padding:13px;background:#edf5ff;border-radius:10px;color:#34567e;font-size:12px;line-height:1.6}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d6dfeb;border-radius:8px;background:white}.field textarea{min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.question{border:1px solid var(--line);border-radius:11px;padding:15px;margin:13px 0;background:#fafcff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted)}.hidden{display:none}.toast{display:none;position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:13px 18px;border-radius:10px;max-width:360px}.footnote{font-size:11px;line-height:1.6;color:var(--muted);margin-top:20px}@media(max-width:900px){.layout{grid-template-columns:185px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.content{padding:20px}}@media(max-width:620px){.layout{display:block}.side{padding:12px;gap:10px}.side footer{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.top{height:56px;padding:0 14px}.content{padding:16px 12px}.head{display:block}.head .btn{margin-top:12px}.head h2{font-size:23px}.card{padding:14px}.formgrid{grid-template-columns:1fr}.pill{display:none}}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script></head><body><div id="app"></div><div class="toast" id="toast"></div><script>
const s={role:'teacher',page:'overview',items:[],loadedFromServer:false,qs:[],currentAssessment:null,answers:{},bundles:[],bundlesLoaded:false,editorMode:'assessment',editingBundleId:null,uploadingImage:false,uploadingLabel:'',pendingImageDeletes:[]};
const demo=[{id:'ASM-101',title:'Persamaan Kuadrat',subject:'Matematika',className:'Kelas IX-A',duration:60,status:'Aktif'},{id:'ASM-102',title:'Sistem Persamaan Linear',subject:'Matematika',className:'Kelas VIII-B',duration:45,status:'Draft'},{id:'ASM-103',title:'Fungsi dan Grafik',subject:'Matematika',className:'Kelas IX-B',duration:50,status:'Selesai'}];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',3200)}
function go(p){s.page=p;render();if(p==='reports')loadAttempts();if(p==='bundles')loadBundles()}function role(r){s.role=r;s.page=r==='teacher'?'overview':'progress';s.currentAssessment=null;render();loadAssessments()}
function head(k,t,d,b=''){return '<div class="head"><div><div class="kicker">'+k+'</div><h2>'+t+'</h2><p>'+d+'</p></div>'+b+'</div>'}
function stat(l,n,d){return '<div class="card"><div class="statlabel">'+l+'</div><div class="num">'+n+'</div><div class="muted">'+d+'</div></div>'}
function nav(){let a=s.role==='teacher' ? [['overview','▦ Ringkasan'],['bundles','▣ Bank soal'],['assessments','▤ Jadwal & asesmen'],['students','♙ Siswa'],['reports','▥ Analitik'],['settings','⚙ Pengaturan']] : [['progress','↗ Progres saya'],['assessments','▤ Jadwal ujian'],['settings','⚙ Pengaturan']];return a.map(function(x){return '<button class="'+(s.page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function rows(){
 const source=s.loadedFromServer?s.items:(s.items.length?s.items:demo);
 if(!source.length)return '<p class="muted">Belum ada asesmen tersimpan di backend.</p>';
 return source.map(a=>{
  const id=esc(a.assessmentId||a.id||'');
  const status=String(a.status||'draft');
  return '<div class="listitem"><div class="symbol">∑</div><div class="grow"><b>'+esc(a.title)+'</b><small>'+esc(a.subject||'Umum')+' · '+esc(a.className||'Kelas')+' · '+(a.duration||45)+' menit · '+(a.questionCount||0)+' soal</small></div><span class="pill '+((status==='Aktif'||status==='published')?'live':'')+'">'+esc(status)+'</span><button class="btn" onclick="openAssessment(\''+id+'\')">'+(s.role==='student'?'Buka':'Detail')+'</button></div>';
 }).join('');
}
function overview(){return head('Dashboard guru','Selamat datang kembali','Pantau asesmen, aktivitas kelas, dan hasil belajar siswa.','<button class="btn primary" onclick="newA()">＋ Buat asesmen</button>')+'<div class="grid stats">'+stat('Total asesmen','12','3 aktif semester ini')+stat('Siswa terdaftar','186','Di 6 kelas belajar')+stat('Rata-rata nilai','81,4','Data contoh')+stat('Perlu diperiksa','8','Jawaban esai menunggu')+'</div><div class="grid columns"><div class="card"><h3>Asesmen terbaru</h3>'+rows()+'</div><div class="card"><h3>Ringkasan kelas</h3>'+[['IX-A',86],['VIII-B',79],['IX-B',74],['VII-A',91]].map(a=>'<p>'+a[0]+' <span style="float:right">'+a[1]+'/100</span></p><div class="bar"><i style="width:'+a[1]+'%"></i></div>').join('')+'<div class="notice">Analisis butir dapat membantu mengenali soal yang terlalu mudah atau sulit.</div></div></div>'}
function assessments(){return head('Jadwal & asesmen','Kelola ujian','Buat asesmen dari bundel soal, lalu tentukan kelas dan jadwal.','<button class="btn primary" onclick="newA()">＋ Buat asesmen kosong</button>')+'<div class="card"><h3>Semua asesmen</h3>'+rows()+'</div>'+(s.qs.length?editor():'')+'<p class="footnote">Bundel soal disimpan terpisah agar dapat digunakan ulang.</p>'}
function bundlesPage(){return head('Perpustakaan soal','Bank soal & bundel','Simpan kumpulan soal untuk digunakan kembali pada jadwal ujian.','<button class="btn primary" onclick="newBundle()">＋ Buat bundel soal</button>')+'<div class="card"><div class="actions"><h3>Bundel tersimpan</h3><button class="btn" onclick="loadBundles()">Muat ulang</button></div>'+(s.bundlesLoaded?bundleRows():'<p class="muted">Memuat bundel soal...</p>')+'</div>'+(s.qs.length?editor():'')+'<p class="footnote">Asesmen dari bundel menjadi salinan terpisah; bundel sumber tetap aman.</p>'}
function bundleRows(){if(!s.bundles.length)return '<p class="muted">Belum ada bundel. Klik Buat bundel soal untuk memulai.</p>';return s.bundles.map(function(x){return '<div class="listitem"><div class="symbol">▣</div><div class="grow"><b>'+esc(x.title)+'</b><small>'+esc(x.subject||'Umum')+' · '+Number(x.questionCount||0)+' soal</small></div><button class="btn" onclick="useBundle(\''+esc(x.bundleId)+'\')">Buat asesmen</button><button class="btn" onclick="editBundle(\''+esc(x.bundleId)+'\')">Edit</button></div>'}).join('')}
function students(){return head('Manajemen kelas','Daftar siswa','Ringkasan siswa dan status pengerjaan.')+'<div class="card"><h3>Siswa terdaftar (contoh)</h3><table class="table"><tr><th>Nama</th><th>Kelas</th><th>Selesai</th><th>Rata-rata</th></tr><tr><td>Alya Putri</td><td>IX-A</td><td>8/9</td><td>91</td></tr><tr><td>Bima Pratama</td><td>IX-A</td><td>7/9</td><td>84</td></tr><tr><td>Citra Lestari</td><td>VIII-B</td><td>9/9</td><td>88</td></tr></table></div>'}
function reports(){
 const attempts=Array.isArray(s.attempts)?s.attempts:[];
 const pending=attempts.filter(a=>a.status==='needs_review');
 return head('Penilaian','Laporan & penilaian jawaban','Periksa jawaban uraian, gunakan rubrik, lalu tetapkan nilai akhir.')+
 '<div class="grid stats">'+stat('Total pengerjaan',String(attempts.length),'Data dari backend')+stat('Menunggu penilaian',String(pending.length),'Jawaban uraian/menjodohkan')+stat('Sudah dinilai',String(attempts.filter(a=>a.status==='graded').length),'Data dari backend')+stat('Perlu ditinjau',String(pending.length),'Pilih pengerjaan di bawah')+'</div>'+
 '<div class="card"><div class="actions"><h3>Jawaban siswa</h3><button class="btn" onclick="loadAttempts()">Muat ulang</button></div>'+
 (!s.attemptsLoaded?'<p class="muted">Memuat pengerjaan...</p>':!attempts.length?'<p class="muted">Belum ada pengerjaan yang masuk.</p>':attempts.map(a=>{
  const id=esc(a.attemptId||''),answers=a.answers||{},qs=a.questionDetails||[];
  return '<div class="question"><div class="actions"><div><b>'+esc(a.studentId||'Siswa')+' · '+esc(a.assessmentTitle||a.assessmentId||'Asesmen')+'</b><p class="muted">'+esc(a.submittedAt||'')+' · Status: '+esc(a.status||'')+'</p></div><span class="pill '+(a.status==='graded'?'live':'')+'">'+esc(a.status||'')+'</span></div>'+
   qs.map((q,i)=>{const val=answers[q.id];const answerText=val===undefined||val===null||val===''?'(Tidak dijawab)':typeof val==='object'&&q.subquestions&&q.subquestions.length?q.subquestions.map((sub,j)=>sub+': '+(val[String(j)]||'(Tidak dijawab)')).join(String.fromCharCode(10)):typeof val==='object'?JSON.stringify(val):String(val);
    return '<div class="question"><b>Soal '+(i+1)+' · '+esc(q.points)+' poin maksimum</b><p>'+esc(q.text||'')+'</p>'+(q.subquestions&&q.subquestions.length?'<ul>'+q.subquestions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'<p><b>Jawaban siswa:</b></p><div style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(answerText)+'</div>'+((q.rubricLevels&&q.rubricLevels.length)?'<p><b>Panduan rubrik:</b></p><ol>'+q.rubricLevels.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'')+'</div>';
   }).join('')+
   '<div class="formgrid"><div class="field"><label>Nilai akhir</label><input id="gradeScore_'+id+'" type="number" min="0" max="'+esc(a.maxScore||0)+'" step="0.5" value="'+esc(a.score||0)+'"></div><div class="field"><label>Nilai maksimum</label><input id="gradeMax_'+id+'" type="number" min="0" value="'+esc(a.maxScore||0)+'"></div></div><div class="field"><label>Umpan balik guru</label><textarea id="gradeFeedback_'+id+'" rows="2">'+esc(a.teacherFeedback||'')+'</textarea></div><div class="actions"><button class="btn primary" onclick="saveGrade(\''+id+'\')">Simpan nilai akhir</button></div></div>';
 }).join(''))+'</div>';
}
async function loadAttempts(){
 s.attemptsLoaded=false;render();
 try{const r=await api('listAttempts',{});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Tidak dapat memuat pengerjaan');s.attempts=Array.isArray(r.data)?r.data:[];s.attemptsLoaded=true;render();}
 catch(e){s.attempts=[];s.attemptsLoaded=true;render();toast('Gagal memuat jawaban siswa: '+e.message)}
}
async function saveGrade(id){
 const scoreEl=document.getElementById('gradeScore_'+id),maxEl=document.getElementById('gradeMax_'+id),feedbackEl=document.getElementById('gradeFeedback_'+id);
 const score=Number(scoreEl&&scoreEl.value),maxScore=Number(maxEl&&maxEl.value);
 try{const r=await api('gradeAttempt',{attemptId:id,score,maxScore,feedback:feedbackEl?feedbackEl.value:''});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Nilai gagal disimpan');toast('Nilai akhir berhasil disimpan.');await loadAttempts();}
 catch(e){toast('Gagal menyimpan nilai: '+e.message)}
}

function progress(){return head('Area siswa','Progres belajar saya','Pantau hasil asesmen dan perkembangan.')+'<div class="grid stats">'+stat('Asesmen selesai','8','Dari 10 tersedia')+stat('Rata-rata nilai','84','Contoh')+stat('Peringkat kelas','5/31','Contoh')+stat('Target belajar','80/100','Tercapai pada contoh')+'</div><div class="card"><h3>Riwayat asesmen</h3>'+[['Persamaan Kuadrat','92'],['Fungsi dan Grafik','81'],['Geometri Dasar','86'],['Statistika','77']].map(a=>'<div class="listitem"><div class="grow"><b>'+a[0]+'</b><small>Hasil asesmen contoh</small></div><strong>'+a[1]+'</strong></div>').join('')+'</div>'}
function settings(){return head('Konfigurasi','Koneksi aplikasi','Rumble Assessment menggunakan Apps Script HTML Service.')+'<div class="card"><h3>Status backend</h3><p class="muted">Halaman ini berjalan melalui Apps Script. Koneksi menggunakan google.script.run sehingga tidak memerlukan URL API di browser.</p><div class="actions"><button class="btn primary" onclick="testApi()">Uji koneksi</button></div><div class="notice">Akses aplikasi tetap dibatasi oleh pengaturan deployment Apps Script. Sebelum menggunakan data siswa asli, pastikan izin setiap peran telah diterapkan di sisi server.</div></div>'}
function newBundle(){s.page='bundles';s.pendingImageDeletes=[];s.editorMode='bundle';s.editingBundleId=null;s.editingId=null;s.meta={title:'',subject:'Matematika',description:'',passageText:'',passageImageUrl:''};s.qs=[{type:'multiple_choice',text:'',points:1,options:['','','','',''],optionImages:[],answer:'0',imageUrl:'',subquestions:[],rubricLevels:[]}];render();setTimeout(function(){document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})},0)}
async function loadBundles(){try{const r=await api('listQuestionBundles');if(!r||!r.ok)throw Error(r&&r.error?r.error:'Gagal memuat bank soal');s.bundles=Array.isArray(r.data)?r.data:[];s.bundlesLoaded=true;if(s.page==='bundles')render()}catch(e){toast('Gagal memuat bank soal: '+e.message)}}
async function useBundle(id){try{const r=await api('getQuestionBundle',{id:id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Bundel tidak tersedia');const b=r.data.bundle||{};s.editorMode='assessment';s.editingBundleId=null;s.editingId=null;s.meta={title:b.title||'',subject:b.subject||'Matematika',className:'',duration:60,startAt:'',endAt:'',passageText:b.passageText||'',passageImageUrl:b.passageImageUrl||''};s.qs=(r.data.questions||[]).map(function(q){return Object.assign({},q,{options:q.options||[],optionImages:q.optionImages||[],subquestions:q.subquestions||[],rubricLevels:q.rubricLevels||[]})});s.page='assessments';render();setTimeout(function(){document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})},0);toast('Bundel dimuat sebagai salinan asesmen baru.')}catch(e){toast('Gagal menggunakan bundel: '+e.message)}}
async function editBundle(id){try{const r=await api('getQuestionBundle',{id:id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Bundel tidak tersedia');const b=r.data.bundle||{};s.editorMode='bundle';s.editingBundleId=b.bundleId;s.editingId=null;s.meta={title:b.title||'',subject:b.subject||'Matematika',description:b.description||'',passageText:b.passageText||'',passageImageUrl:b.passageImageUrl||''};s.qs=(r.data.questions||[]).map(function(q){return Object.assign({},q,{options:q.options||[],optionImages:q.optionImages||[],subquestions:q.subquestions||[],rubricLevels:q.rubricLevels||[]})});s.page='bundles';render();setTimeout(function(){document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})},0)}catch(e){toast('Gagal membuka bundel: '+e.message)}}
async function saveBundle(){const title=document.getElementById('title').value.trim();if(!title||!s.qs.length){toast('Isi nama bundel dan minimal satu soal.');return}const payload={bundleId:s.editingBundleId||undefined,title:title,subject:document.getElementById('subject').value,description:document.getElementById('className').value,passageText:(s.meta||{}).passageText||'',passageImageUrl:(s.meta||{}).passageImageUrl||'',questions:s.qs};try{const r=await api('saveQuestionBundle',payload);if(!r||!r.ok)throw Error(r&&r.error?r.error:'Bundel gagal disimpan');await processPendingImageDeletes();toast('Bundel soal tersimpan di bank soal.');s.pendingImageDeletes=[];s.qs=[];s.meta={};s.editingBundleId=null;s.editorMode='bundle';s.page='bundles';await loadBundles();render()}catch(e){toast('Gagal menyimpan bundel: '+e.message)}}
function newA(){s.page='assessments';s.editorMode='assessment';s.editingBundleId=null;s.pendingImageDeletes=[];s.editingId=null;s.meta={title:'',subject:'Matematika',className:'',duration:60,startAt:'',endAt:'',passageText:'',passageImageUrl:''};s.qs=[{type:'multiple_choice',text:'',points:1,options:['','','','',''],optionImages:[],answer:'0',imageUrl:'',subquestions:[],rubricLevels:[]}];render();setTimeout(()=>document.getElementById('editor')?.scrollIntoView({behavior:'smooth'}),0)}
function editor(){
 s.qs.forEach(q=>{if(q.type==='multiple_choice'||q.type==='multi_select'){q.options=Array.from({length:5},(_,j)=>q.options?.[j]||'');q.optionImages=Array.from({length:5},(_,j)=>q.optionImages?.[j]||'');}if(!Array.isArray(q.subquestions))q.subquestions=[];if(!Array.isArray(q.rubricLevels))q.rubricLevels=[];if(q.type==='essay'&&!q.rubricLevels.length){q.rubricLevels=q.rubric?String(q.rubric).split(String.fromCharCode(10)):defaultRubricLevels(q.points,q.subquestions);}});
 const m=s.meta||{};
 return '<div id="editor" class="card" style="margin-top:16px"><h3>'+(s.editorMode==='bundle'?(s.editingBundleId?'Edit bundel soal':'Buat bundel soal'):(s.editingId?'Edit asesmen':'Buat asesmen baru'))+'</h3>'+(s.uploadingImage?'<div class="notice">⏳ '+esc(s.uploadingLabel||'Sedang mengunggah gambar...')+'</div>':'')+'<div class="formgrid"><div class="field"><label>'+(s.editorMode==='bundle'?'Nama bundel *':'Judul asesmen *')+'</label><input id="title" placeholder="Persamaan Kuadrat" value="'+esc(m.title||'')+'" oninput="s.meta.title=this.value"></div><div class="field"><label>Mata pelajaran</label><input id="subject" value="'+esc(m.subject||'Matematika')+'" oninput="s.meta.subject=this.value"></div><div class="field"><label>'+(s.editorMode==='bundle'?'Deskripsi bundel':'Kelas ujian')+'</label><input id="className" placeholder="IX-A" value="'+esc(s.editorMode==='bundle'?(m.description||''):(m.className||''))+'" oninput="s.meta.description=this.value"></div><div class="field"><label>Durasi (menit)</label><input id="duration" type="number" value="'+esc(m.duration||60)+'" min="1" max="300" oninput="s.meta.duration=this.value"></div><div class="field" style="'+(s.editorMode==='bundle'?'display:none':'')+'"><label>Mulai (opsional)</label><input id="startAt" type="datetime-local" value="'+esc(m.startAt||'')+'"></div><div class="field" style="'+(s.editorMode==='bundle'?'display:none':'')+'"><label>Berakhir (opsional)</label><input id="endAt" type="datetime-local" value="'+esc(m.endAt||'')+'"></div></div><div class="field"><label>Bacaan / stimulus bersama (opsional)</label><textarea rows="5" oninput="s.meta.passageText=this.value;previewMath(this)" onpaste="handleEquationPaste(event,this,&quot;passage&quot;)">'+esc(m.passageText||'')+'</textarea><div class="math-preview" style="padding:8px 0"></div><small class="muted">Bacaan ini akan ditampilkan satu kali di atas seluruh soal asesmen, sehingga bisa dipakai untuk 2–3 soal atau lebih.</small><input id="passageImageFile" type function renderMath(root){if(typeof renderMathInElement!=='function')return;try{renderMathInElement(root,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});}catch(e){}}

function handleEquationPaste(event,el,kind,i,j){
 const cd=event.clipboardData;if(!cd)return;
 const items=Array.from(cd.items||[]);const imageItem=items.find(item=>item.kind==='file'&&/^image\//.test(item.type));
 if(imageItem){
  if(kind==='passage'){event.preventDefault();const file=imageItem.getAsFile();if(file)uploadImageBlob(file,file.name||'gambar-bacaan.png','passage');return;}
  event.preventDefault();const file=imageItem.getAsFile();if(file)uploadImageBlob(file,file.name||'gambar-soal.png',kind,i,j);return;
 }
 let text=cd.getData('text/plain');
 if(!text){const html=cd.getData('text/html');if(html){const tmp=document.createElement('div');tmp.innerHTML=html;text=tmp.textContent||tmp.innerText||'';}}
 if(!text)return;
 const hasMath=/[=^_]|[√∫≤≥×÷±]/.test(text)||text.includes('\\');
 if(hasMath&&!text.includes('$')&&!text.includes('\\(')&&!text.includes('\\[')){
  event.preventDefault();const start=el.selectionStart||0,end=el.selectionEnd||start;const value='\\('+text+'\\)';
  if(typeof el.setRangeText==='function')el.setRangeText(value,start,end,'end');else el.value=el.value.slice(0,start)+value+el.value.slice(end);
  if(kind==='question'&&s.qs[i])s.qs[i].text=el.value;
  else if(kind==='option'&&s.qs[i])s.qs[i].options[j]=el.value;
  else if(kind==='passage'&&s.meta)s.meta.passageText=el.value;
  previewMath(el);
 }
}

function imageUrlFor(kind,i,j){if(kind==='passage')return (s.meta||{}).passageImageUrl||'';if(kind==='question')return s.qs[i]?.imageUrl||'';return s.qs[i]?.optionImages?.[j]||''}

async function removeDriveImage(url){const fileId=imageFileId(url);if(!fileId)return;try{await api('deleteAssessmentImage',{fileId:fileId})}catch(e){console.warn('File lama belum dapat dipindahkan ke sampah Drive:',e.message)}}
async function removeAssessmentImage(kind,i,j){const url=imageUrlFor(kind,i,j);if(!url)return;if(!confirm('Hapus gambar ini dari editor? File Drive akan dipindahkan ke sampah setelah bundel/asesmen berhasil disimpan.'))return;s.pendingImageDeletes=s.pendingImageDeletes||[];s.pendingImageDeletes.push(url);setImageUrl(kind,i,j,'');render();toast('Gambar ditandai untuk dihapus setelah penyimpanan.')} 
async function processPendingImageDeletes(){const list=[...new Set(s.pendingImageDeletes||[])];s.pendingImageDeletes=[];for(const url of list){const id=imageFileId(url);if(!id)continue;try{const r=await api('deleteAssessmentImage',{fileId:id});if(!r||!r.ok)throw Error(r&&r.error?r.error:'Gagal menghapus');}catch(e){console.warn('File gambar lama tidak terhapus otomatis:',e.message);toast('Perubahan tersimpan, tetapi satu gambar lama belum bisa dibuang dari Drive.')}}}
async function uploadImageBlob(file,name,kind,i,j){
 if(file.size>4*1024*1024){toast('Ukuran gambar maksimal 4 MB.');return}
 if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){toast('Gunakan gambar JPG, PNG, WebP, atau GIF.');return}
 if(s.uploadingImage){toast('Tunggu hingga unggahan sebelumnya selesai.');return}
 const previousUrl=imageUrlFor(kind,i,j);
 s.uploadingImage=true;s.uploadingLabel='Mengunggah gambar '+(kind==='passage'?'bacaan':kind==='question'?'soal':'opsi jawaban')+'...';render();
 try{
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Gagal membaca gambar'));reader.readAsDataURL(file)});
  const base64=String(dataUrl).split(',')[1]||'';
  const result=await api('uploadAssessmentImage',{fileName:name,mimeType:file.type,base64,kind,assessmentId:s.editingId||((s.currentAssessment||{}).assessment||{}).assessmentId||''});
  if(!result||!result.ok)throw Error(result&&result.error?result.error:'Upload gambar gagal');
  const url=result.data.imageUrl||result.data.url;
  setImageUrl(kind,i,j,url);
  if(previousUrl&&previousUrl!==url){s.pendingImageDeletes=s.pendingImageDeletes||[];s.pendingImageDeletes.push(previousUrl);}
  toast(result.data.warning?'Gambar tersimpan. '+result.data.warning:'Gambar berhasil diunggah ke Drive.');
 }catch(e){toast('Gagal mengunggah gambar: '+e.message)}
 finally{s.uploadingImage=false;s.uploadingLabel='';render()}
}

function render(){let p=s.page,c=p==='overview'?overview():p==='bundles'?bundlesPage():p==='assessments'?assessments():p==='detail'?detailPage():p==='students'?students():p==='reports'?reports():p==='progress'?progress():settings();document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="brand"><span class="logo">R</span><span>Rumble Assessment<br><small>Learning, measured.</small></span></div><nav class="nav">'+nav()+'</nav><footer>Platform asesmen digital<br>Versi awal · Preview</footer></aside><main class="main"><header class="top"><span class="muted">Workspace / '+p+'</span><span>'+s.role+' <select onchange="role(this.value)"><option value="teacher" '+(s.role==='teacher'?'selected':'')+'>Guru</option><option value="student" '+(s.role==='student'?'selected':'')+'>Siswa</option></select></span></header><div class="content">'+c+'</div></main></div>';document.querySelectorAll('.question p,.math-content,.passage-content').forEach(el=>renderMath(el));document.querySelectorAll('.math-preview').forEach(el=>{if(!el.textContent.trim()&&el.previousElementSibling)el.textContent=el.previousElementSibling.value||'';renderMath(el)});document.querySelectorAll('.question textarea').forEach((el,i)=>el.setAttribute('data-question-index',i));}
render();
loadAssessments();
</script></body></html>
